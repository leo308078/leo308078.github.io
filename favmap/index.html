<style>
/* 版面：上面一條控制列（標題／地區／說明＋類別），下面整塊是地圖（MapLibre 向量圖）；
   點標記跳卡片（桌機浮在左上、手機貼底）。手機版像 Google 地圖：地圖鋪滿，上面那排浮在地圖上。 */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --ink: #1b2422;
  --ink-2: #56625f;
  --ink-3: #87918e;
  --line: #d9e0de;
  --accent: #0e6b5c;
  --accent-ink: #ffffff;
  --accent-soft: #dcefea;
  --gold: #e0a100;
  --gold-soft: #fff4d1;
  --warn: #d9480f;
  --warn-soft: #fff0e6;
  --bad: #c92a2a;
  --bad-soft: #ffe8e8;
  --me: #1a73e8;
  --me-soft: rgba(26,115,232,.22);
  --shadow: 0 1px 2px rgba(20,30,28,.18), 0 4px 14px rgba(20,30,28,.14);
  --shadow-hot: 0 3px 6px rgba(20,30,28,.28), 0 10px 24px rgba(20,30,28,.30);
  --shadow-lo: 0 1px 3px rgba(20,30,28,.22);
  --marker-bg: #ffffff;
  --marker-ink: #1b2422;
  --c-brunch: #d0761c;
  --c-cafe: #855638;
  --c-dessert: #d23f74;
  --c-catcafe: #7754c2;
  --c-meal: #2f7a3c;
  --c-matcha: #4f7d1f;
  --c-spot: #1f6f99;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-quote: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121817; --surface: #1c2422; --surface-2: #232d2b; --ink: #e8eeec; --ink-2: #a9b5b1; --ink-3: #7a8784;
    --line: #33403d; --accent: #4fc3a8; --accent-ink: #0d1716; --accent-soft: #1d3a34;
    --gold: #f2bf2c; --gold-soft: #3a3016; --warn: #ff8a4c; --warn-soft: #3d2416; --bad: #ff6b6b; --bad-soft: #3d1c1c;
    --me: #5aa2ff; --me-soft: rgba(90,162,255,.25);
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.45);
    --shadow-hot: 0 3px 6px rgba(0,0,0,.6), 0 10px 26px rgba(0,0,0,.65);
    --shadow-lo: 0 1px 3px rgba(0,0,0,.5);
    --marker-bg: #263130; --marker-ink: #eef3f1;
    --c-brunch: #ee9a45; --c-cafe: #c08a64; --c-dessert: #f06a9a; --c-catcafe: #a58bf0; --c-meal: #5cb36a; --c-matcha: #9ccc5e; --c-spot: #5fb3dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121817; --surface: #1c2422; --surface-2: #232d2b; --ink: #e8eeec; --ink-2: #a9b5b1; --ink-3: #7a8784;
  --line: #33403d; --accent: #4fc3a8; --accent-ink: #0d1716; --accent-soft: #1d3a34;
  --gold: #f2bf2c; --gold-soft: #3a3016; --warn: #ff8a4c; --warn-soft: #3d2416; --bad: #ff6b6b; --bad-soft: #3d1c1c;
  --me: #5aa2ff; --me-soft: rgba(90,162,255,.25);
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.45);
  --shadow-hot: 0 3px 6px rgba(0,0,0,.6), 0 10px 26px rgba(0,0,0,.65);
  --shadow-lo: 0 1px 3px rgba(0,0,0,.5);
  --marker-bg: #263130; --marker-ink: #eef3f1;
  --c-brunch: #ee9a45; --c-cafe: #c08a64; --c-dessert: #f06a9a; --c-catcafe: #a58bf0; --c-meal: #5cb36a; --c-matcha: #9ccc5e; --c-spot: #5fb3dc;
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  overflow: hidden; overscroll-behavior: none;
}
button { touch-action: manipulation; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ── 控制列 ── */
.top {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 12px; display: grid; gap: 10px; position: relative; z-index: 5;
}
.bar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; min-width: 0; }
.more { display: grid; gap: 8px; }
.top.folded .more { display: none; }
.fold {
  appearance: none; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
  font: inherit; font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; flex: none;
}
#regbtn { margin-left: auto; }
.fold .fa { display: inline-block; transition: transform .15s; }
.fold[aria-expanded="true"] .fa { transform: rotate(180deg); }
.note { margin: 0; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.fold:focus-visible, .chip:focus-visible, .ctl:focus-visible, .card a:focus-visible, .card-x:focus-visible, .rg:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip {
  appearance: none; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 15px 5px 5px; border-radius: 999px; border: 2px solid var(--cc); background: var(--surface); color: var(--ink);
}
.chip .em { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 19px; }
.chip .ct { font-variant-numeric: tabular-nums; color: var(--cc); font-weight: 800; font-size: 16px; }
.chip[aria-pressed="false"] { border-color: var(--line); color: var(--ink-3); background: var(--surface-2); }
.chip[aria-pressed="false"] .em { filter: grayscale(1); opacity: .55; }
.chip[aria-pressed="false"] .ct { color: var(--ink-3); }
.chip.all { --cc: var(--ink-3); border-color: var(--line); color: var(--ink); font-weight: 700; }
.chip.all .em { font-size: 15px; font-weight: 800; color: var(--ink-2); }
.legend { font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 6px 18px; flex-wrap: wrap; margin: 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-star { width: 22px; height: 22px; border-radius: 50%; background: var(--marker-bg); border: 2px solid var(--ink-3); box-shadow: 0 0 0 3px var(--gold), var(--shadow-hot); box-sizing: border-box; }
.lg-lo { width: 15px; height: 15px; border-radius: 50%; background: var(--marker-bg); border: 2px solid var(--ink-3); opacity: .7; box-sizing: border-box; }
.lg-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--ink-3); border: 2px solid var(--marker-bg); box-shadow: var(--shadow-lo); box-sizing: border-box; }
.lg-w { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font-size: 14px; }
.lg-w.bad { background: var(--bad); border: 1.5px solid var(--bad); color: #fff; font-weight: 800; }
.lg-cnt { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; font-weight: 800; font-style: normal; background: var(--ink); color: var(--surface); border: 1.5px solid var(--marker-bg); box-sizing: border-box; }

/* 地區跳轉（下拉） */
.regions {
  position: absolute; z-index: 7; right: max(16px, env(safe-area-inset-right, 0px)); top: 56px; width: 360px; max-width: calc(100% - 32px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.22);
  padding: 10px 12px 12px; box-sizing: border-box; display: grid; gap: 8px; max-height: 70vh; overflow: auto;
}
.regions h3 { margin: 2px 0 0; font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .06em; }
.rgs { display: flex; flex-wrap: wrap; gap: 6px; }
.rg {
  appearance: none; font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; color: var(--ink);
  background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; display: inline-flex; gap: 6px; align-items: baseline;
}
.rg .ct { font-size: 12.5px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rg.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rg.main .ct { color: var(--accent-ink); opacity: .8; }

/* ── 地圖 ── */
.map { position: relative; flex: 1; min-height: 300px; overflow: hidden; background: var(--surface-2); }
#gl { position: absolute; inset: 0; }
#gl .maplibregl-canvas:focus { outline: none; }

/* 目前位置 */
.me { width: 20px; height: 20px; pointer-events: none; }
.me .halo { position: absolute; left: -20px; top: -20px; width: 60px; height: 60px; border-radius: 50%; background: var(--me-soft); }
.me .dotme { position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-sizing: border-box; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
@media (prefers-reduced-motion: no-preference) {
  .me .halo { animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.55); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
}

/* 地圖上的按鈕與版權 */
.ctls { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(30px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 7px; justify-items: end; z-index: 3; }
.ctl { appearance: none; min-width: 44px; height: 44px; padding: 0 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 22px; line-height: 1; cursor: pointer; box-shadow: var(--shadow); display: grid; place-items: center; }
.ctl.txt { font-size: 14px; font-weight: 700; }
.ctl.loc { width: 48px; height: 48px; border-radius: 50%; font-size: 22px; padding: 0; }
.ctl.loc.busy { animation: busy 1s ease-in-out infinite alternate; }
@keyframes busy { from { box-shadow: var(--shadow); } to { box-shadow: 0 0 0 6px var(--me-soft), var(--shadow); } }
.attrib { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 3; font-size: 11px; color: var(--ink-2); }
.attrib > summary { list-style: none; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; background: color-mix(in srgb, var(--surface) 85%, transparent); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.attrib > summary::-webkit-details-marker { display: none; }
.attrib[open] > span { display: block; margin-top: 4px; max-width: 70vw; background: var(--surface); padding: 4px 8px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.2); line-height: 1.5; }
.attrib a { color: inherit; }
.hint { position: absolute; left: calc(max(8px, env(safe-area-inset-left, 0px)) + 32px); bottom: 8px; z-index: 3; font-size: 13px; color: var(--ink); background: color-mix(in srgb, var(--surface) 90%, transparent); padding: 4px 10px; border-radius: 8px; box-shadow: var(--shadow-lo); max-width: calc(100% - 460px); }
.toast { position: absolute; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 8; max-width: calc(100% - 40px); box-sizing: border-box;
  background: var(--ink); color: var(--surface); font-size: 14px; padding: 8px 14px; border-radius: 10px; box-shadow: var(--shadow); text-align: center; }

/* ── 卡片 ── */
.card {
  position: absolute; z-index: 6; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; width: 350px; max-width: calc(100% - 24px);
  background: var(--surface); color: var(--ink); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); border: 1px solid var(--line);
  padding: 14px 16px 16px; box-sizing: border-box; display: grid; gap: 10px; max-height: calc(100% - 24px); overflow: auto; overscroll-behavior: contain;
}
.card-h { display: flex; align-items: flex-start; gap: 10px; }
.card-h .ico { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: var(--surface-2); border: 2px solid var(--cc); }
.card-h .nm2 { min-width: 0; flex: 1; }
.card-h h2 { margin: 0; font-size: 18px; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
.card-h .meta { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
.tag { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--cc); border: 1px solid var(--cc); }
.tag.star { color: var(--ink); background: var(--gold-soft); border-color: var(--gold); }
.card-x { appearance: none; border: 0; background: var(--surface-2); color: var(--ink-2); width: 32px; height: 32px; border-radius: 50%; font-size: 19px; line-height: 1; cursor: pointer; flex: none; }
.quote { margin: 4px 0 0; text-align: center; padding: 10px 8px 6px; }
.quote .why { font-family: var(--font-quote); font-weight: 600; font-size: 21px; line-height: 1.45; text-wrap: balance; color: var(--ink); }
.quote .why::before { content: "「"; color: var(--accent); }
.quote .why::after { content: "」"; color: var(--accent); }
.quote .cap-t { display: block; margin-top: 4px; font-size: 11.5px; color: var(--ink-3); letter-spacing: .06em; }
.alert { font-size: 13px; border-radius: 10px; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; }
.alert.bad { background: var(--bad-soft); color: var(--ink); border: 1px solid var(--bad); }
.alert.bad b { color: var(--bad); }
.rows { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13.5px; margin: 0; }
.rows dt { color: var(--ink-3); }
.rows dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.rows .sub { color: var(--ink-3); font-size: 11.5px; }
.tags { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
/* 必點：「🍴 必點：」固定在左邊，品項在右邊自己換行（一個品名不從中間斷開） */
.dishes { margin: 0; display: flex; gap: 6px; align-items: baseline; font-size: 15px; line-height: 1.55; }
.dishes .dh { flex: none; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.dishes .dl { min-width: 0; }
.dishes .d { display: inline-block; max-width: 100%; overflow-wrap: anywhere; font-weight: 600; color: var(--ink); }
.dishes .dn { font-size: 11.5px; font-weight: 700; color: var(--accent); margin-left: 2px; }
.tags li { font-size: 13px; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.posts { display: grid; gap: 6px; }
.posts-h { font-size: 12px; color: var(--ink-3); letter-spacing: .04em; }
.go {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; font-weight: 700; font-size: 14.5px; line-height: 1.35;
  background: var(--accent); color: var(--accent-ink); border: 1.5px solid var(--accent); border-radius: 10px; padding: 10px 12px; text-align: left;
}
.go .pt { min-width: 0; overflow-wrap: anywhere; }
.go .pp { flex: none; font-size: 12px; font-weight: 700; opacity: .85; }
.go.alt { background: var(--surface); color: var(--ink); }
.go.alt .pp { color: var(--accent); opacity: 1; }
.go:hover { filter: brightness(1.08); }
/* 同一個位置好幾家：先選一家 */
.pick { display: grid; gap: 6px; }
.pk { appearance: none; font: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%;
  background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.pk .em { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 19px; background: var(--surface-2); border: 2px solid var(--cc); box-sizing: border-box; }
.pk .pn { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.pk .pn small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.pk .pk-go { flex: none; color: var(--accent); font-size: 20px; font-weight: 700; }
.pk.star { border-color: var(--gold); }
.same { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.same button { appearance: none; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }

@media (max-width: 640px) {
  /* 像 Google 地圖：地圖鋪滿整個螢幕，上面只浮一條標題列＋一排類別，其他收進「說明」 */
  .app { display: block; }
  .map { position: absolute; inset: 0; min-height: 0; }
  .top {
    position: absolute; z-index: 5; left: 0; right: 0; top: 0; background: transparent; border: 0; pointer-events: none;
    gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
  }
  .top > * { pointer-events: auto; }
  .bar {
    flex-wrap: nowrap; gap: 4px; min-height: 48px; box-sizing: border-box; padding: 5px 5px 5px 16px;
    background: var(--surface); border-radius: 26px; box-shadow: 0 2px 8px rgba(0,0,0,.28);
  }
  h1 { font-size: 16.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fold { font-size: 13.5px; padding: 6px 10px; border-width: 1px; }
  .more { background: var(--surface); border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.28); padding: 10px 12px; max-height: 45vh; overflow: auto; }
  .regions { position: static; width: auto; max-width: none; max-height: 52vh; box-shadow: 0 2px 8px rgba(0,0,0,.28); border: 0; }
  .chip { box-shadow: 0 1px 4px rgba(0,0,0,.28); }
  .note { font-size: 11.5px; line-height: 1.45; }
  /* 類別按鈕一行，放不下就在那一行裡左右滑，地圖才不會被擠小 */
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -10px; padding-inline: 10px; padding-block: 2px 8px; gap: 6px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-size: 14.5px; padding: 3px 11px 3px 3px; gap: 5px; }
  .chip .em { width: 27px; height: 27px; font-size: 16px; }
  .chip .ct { font-size: 14.5px; }
  .legend { font-size: 12.5px; gap: 6px 14px; }
  .card { left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: auto; max-width: none; max-height: 56%; }
  .quote .why { font-size: 19px; }
  .hint { display: none; }
  .ctl.zm { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">

}

  for (const f of fs) {

    const res = isSel ? "sel" : g;
    if (id.endsWith("-name")) { if (names.has(id + ":" + pr.i)) return res; continue; }
    const q = map.project([g.lead.lng, g.lead.lat]), dist = Math.hypot(q.x - pt.x, q.y - pt.y);
    if (id === "fm-dot" ? dist <= 14 : dist <= sealR(pr.lvl) + 6) return res;
  }
  return null;
}
map.on("click", e => {
  const h = hitAt(e.point);
  if (h === "sel") return;                         // 點到已經選中的那個：維持
  if (!h) closeCard();
  else if (h.members.length > 1) openChooser(h);   // 同一個位置好幾家：先選
  else openCard(h.lead);
});
map.on("mousemove", e => { map.getCanvas().style.cursor = hitAt(e.point) ? "pointer" : ""; });

/* ── 卡片 ── */
function openChooser(g) {
  selected = null; selGroup = g;
  const lead = g.lead;
  card.style.setProperty("--cc", "var(--ink-3)");
  card.innerHTML = `
    <div class="card-h">
      <div class="ico">📍</div>
      <div class="nm2"><h2>同一個位置有 ${g.members.length} 家</h2><div class="meta"><span>${esc(lead.addr || "")}</span></div></div>
      <button class="card-x" id="card-x" aria-label="關閉">×</button>
    </div>
    <div class="pick">${g.members.map(p => { const c = CATS[catOf(p)];
      return `<button class="pk${p.n >= 2 ? " star" : ""}" data-i="${p.i}" style="--cc:var(${c.color})"><span class="em">${c.em}</span><span class="pn">${esc(p.name)}<small>${p.cats.map(k => CATS[k].name).join("・")}・${p.n >= 2 ? `⭐ 收藏 ${p.n} 次` : "收藏 1 次"}${p.bad ? "・✗ 去過・雷" : ""}</small></span><span class="pk-go" aria-hidden="true">›</span></button>`; }).join("")}</div>`;
  card.hidden = false;
  card.scrollTop = 0;
  $("card-x").onclick = closeCard;
  card.querySelectorAll(".pk").forEach(b => b.onclick = () => openCard(PLACES[+b.dataset.i]));
  applySelFilter();
  requestAnimationFrame(() => keepVisible(lead));
}
function openCard(p) {
  selected = p; selGroup = null;
  const cat = p.cats.find(c => !hidden.has(c)) || p.cats[0];
  const c = CATS[cat];
  card.style.setProperty("--cc", `var(${c.color})`);
  const where = [p.region, p.city && p.city !== p.region ? p.city : ""].filter(Boolean).join("・");
  const posts = p.posts || [];
  card.innerHTML = `
    <div class="card-h">
      <div class="ico">${c.em}</div>
      <div class="nm2">
        <h2>${esc(p.name)}${p.branch ? `<span style="font-weight:500;font-size:15px;color:var(--ink-2)">（${esc(p.branch)}）</span>` : ""}</h2>
        <div class="meta">${p.cats.map(k => `<span class="tag" style="--cc:var(${CATS[k].color})">${CATS[k].name}</span>`).join("")}${p.n >= 2 ? `<span class="tag star">⭐ 收藏 ${p.n} 次</span>` : `<span>收藏 1 次</span>`}${where ? `<span>${esc(where)}</span>` : ""}</div>
      </div>
      <button class="card-x" id="card-x" aria-label="關閉">×</button>
    </div>
    ${p.g && p.g.members.length > 1 ? `<div class="same">同一個位置還有：${p.g.members.filter(o => o !== p).map(o => `<button data-i="${o.i}">${esc(o.name)}</button>`).join("")}</div>` : ""}
    ${p.feat ? `<p class="quote"><span class="why">${esc(p.feat)}</span><span class="cap-t">貼文說的特色（AI 從貼文文字整理）</span></p>` : ""}
    ${p.dishes && p.dishes.length ? `<p class="dishes"><span class="dh">🍴 必點：</span><span class="dl">${p.dishes.map((d, i, a) => `<span class="d">${esc(d.t)}${d.n >= 2 ? `<span class="dn" title="${d.n} 篇貼文都提到">×${d.n}</span>` : ""}${i < a.length - 1 ? "、" : ""}</span>`).join("")}</span></p>` : ""}
    ${p.bad ? `<div class="alert bad"><span>✗</span><div><b>去過・雷</b>：${p.badNote ? esc(p.badNote) : "你去過，覺得不值得再去。"}</div></div>` : ""}
    ${p.tags && p.tags.length ? `<ul class="tags" aria-label="貼文裡提到的">${p.tags.map(t => `<li>#${esc(t)}</li>`).join("")}</ul>` : ""}
    <dl class="rows">
      ${p.addr ? `<dt>地址</dt><dd>${esc(p.addr)}</dd>` : ""}
      <dt>收藏</dt><dd>${p.n} 次${posts.length > 1 ? `（${posts.length} 則貼文）` : ""}</dd>
    </dl>
    ${posts.length ? `<div class="posts">
      <div class="posts-h">當初收藏的貼文${posts.length > 1 ? `（${posts.length} 則）` : ""}</div>
      ${posts.map((q, i) => `<a class="go${i ? " alt" : ""}${igMediaId(q.u) ? " ig" : ""}" href="${esc(q.u)}" target="_blank" rel="noopener"><span class="pt">${esc(q.t || `看當初收藏的貼文（${q.p}）`)}</span><span class="pp">${esc(q.p)} ↗</span></a>`).join("")}
    </div>` : ""}
    ${p.maps ? `<a class="go alt gmap" href="${esc(p.maps)}" target="_blank" rel="noopener"><span class="pt">在 Google 地圖打開（營業時間、評論、導航）</span><span class="pp">↗</span></a>` : ""}`;
  card.hidden = false;
  card.scrollTop = 0;
  $("card-x").onclick = closeCard;
  card.querySelectorAll(".same button").forEach(b => b.onclick = () => openCard(PLACES[+b.dataset.i]));
  applySelFilter();
  requestAnimationFrame(() => keepVisible(p.g ? p.g.lead : p));
}
function closeCard() {
  if (!selected && !selGroup && card.hidden) return;
  selected = null; selGroup = null; card.hidden = true;
  applySelFilter();
}
// 點開的那家如果被卡片或上面那排擋住，就把地圖挪一下
function keepVisible(p) {
  const W = mapEl.clientWidth, H = mapEl.clientHeight, mr = mapEl.getBoundingClientRect(), cr = card.getBoundingClientRect();
  const q = map.project([p.lng, p.lat]);
  let L = 30, R = W - 30, T = topCover() + 40, B = H - 30;
  if (narrow()) B = cr.top - mr.top - 20;
  else if (q.x < cr.right - mr.left + 30 && q.y < cr.bottom - mr.top + 30) L = cr.right - mr.left + 40;
  if (B - T < 60 || R - L < 60) return;
  if (q.x >= L && q.x <= R && q.y >= T && q.y <= B) return;
  const tx = (L + R) / 2, ty = (T + B) / 2;
  map.easeTo({ center: map.unproject([q.x - (tx - W / 2), q.y - (ty - H / 2)]), duration: 450 });
}
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { closeCard(); setRegions(false); } });

/* ── 按鈕 ── */
$("zin").onclick = () => map.zoomIn();
$("zout").onclick = () => map.zoomOut();

let toastT = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3500);
}

/* iPhone：從主畫面開的網頁 App 點外部連結，會開在 App 內的小瀏覽器，跳不進 App（Google 地圖還被導去 App Store；Leo 2026-10-25 錄影）
   → 直接用 App 的網址開：Google 地圖 comgooglemapsurl://、IG 貼文 instagram://media?id=（Threads 沒有可靠的 App 網址，照舊開網頁）；
   畫面沒被切走（沒裝 App）就在 2.5 秒後改開網頁版。電腦、Android 照舊開網頁。 */
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
// IG 貼文／reel 網址的代碼（/p/CODE/、/reel/CODE/）是數字編號用 base64url 寫的：逐字 id = id × 64 + 字母表位置。
// 私人帳號的代碼會超過 11 碼，只取前 11 碼算。
const IG_ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
function igMediaId(url) {
  const m = /instagram\.com\/(?:[^/?#]+\/)?(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/.exec(url || "");
  if (!m || typeof BigInt !== "function") return null;
  let id = BigInt(0);
  for (const ch of m[1].slice(0, 11)) id = id * BigInt(64) + BigInt(IG_ABC.indexOf(ch));
  return id.toString();
}
function appUrlOf(a) {
  if (a.classList.contains("gmap")) return "comgooglemapsurl://" + a.href.replace(/^https?:\/\//, "");
  if (a.classList.contains("ig")) { const id = igMediaId(a.href); return id ? "instagram://media?id=" + id : null; }
  return null;
}
document.addEventListener("click", ev => {
  const a = ev.target.closest && ev.target.closest("a.gmap, a.ig");
  if (!a || !IOS) return;
  const app = appUrlOf(a);
  if (!app) return;
  ev.preventDefault();
  const web = a.href;
  let left = false;
  const gone = () => { left = true; };
  window.addEventListener("pagehide", gone, { once: true });
  window.addEventListener("blur", gone, { once: true });
  document.addEventListener("visibilitychange", () => { if (document.hidden) left = true; }, { once: true });
  window.favmap.lastApp = app;          // 驗收用：最後一次叫的 App 網址
  location.href = app;
  setTimeout(() => { if (!left && !document.hidden) window.open(web, "_blank"); }, 2500);
});

/* ── 目前位置：一打開就跳過去；不允許就留在全台；右下角 📍 隨時跳回 ── */
function showMe(pos) {
  me = { lng: pos.coords.longitude, lat: pos.coords.latitude, t: Date.now() };
  if (!meMarker) {
    const el = document.createElement("div");
    el.className = "me";
    el.innerHTML = '<div class="halo"></div><div class="dotme"></div>';
    meMarker = new maplibregl.Marker({ element: el }).setLngLat([me.lng, me.lat]).addTo(map);
  } else meMarker.setLngLat([me.lng, me.lat]);
}
function flyToMe() { map.flyTo({ center: [me.lng, me.lat], zoom: Math.max(map.getZoom(), ME_ZOOM), padding: { top: topCover() }, duration: 1400 }); }
let watching = false;
function locate(fly, quiet) {
  const btn = $("locate");
  if (!("geolocation" in navigator)) { if (!quiet) toast("這個瀏覽器不能定位"); return; }
  btn.classList.add("busy");
  navigator.geolocation.getCurrentPosition(pos => {
    btn.classList.remove("busy");
    showMe(pos);
    if (fly) flyToMe();
    if (!watching) {
      watching = true;
      navigator.geolocation.watchPosition(showMe, () => {}, { enableHighAccuracy: true, maximumAge: 30000 });
    }
  }, err => {
    btn.classList.remove("busy");
    if (quiet) return;
    toast(err.code === 1 ? "沒有定位權限：到瀏覽器（或 iPhone 設定 → Safari → 位置）允許這個網站定位" : "暫時抓不到位置，等一下再按一次");
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}
$("locate").onclick = () => { if (me && Date.now() - me.t < 120000) flyToMe(); else locate(true, false); };
// 使用者自己先動了地圖，晚到的定位就不要把畫面拉走
map.on("movestart", e => { if (e.originalEvent) userMoved = true; });
map.once("load", () => {
  navigator.geolocation && navigator.geolocation.getCurrentPosition(pos => {
    showMe(pos);
    if (!userMoved) flyToMe();
    if (!watching) { watching = true; navigator.geolocation.watchPosition(showMe, () => {}, { enableHighAccuracy: true, maximumAge: 30000 }); }
  }, () => {}, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
});

/* ── 自動更新：GitHub Pages 讓手機快取 10 分鐘、主畫面 App 切回來也不重載，會一直看到舊版 →
   打開／切回來時比對網站上的 version.txt（deploy.py 寫的），不一樣就換到 ?v=新版 的網址（新網址不吃舊快取） ── */
function checkUpdate() {
  const m = document.querySelector('meta[name="book-version"]');
  if (!m || location.protocol === "file:") return;
  fetch("version.txt?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(v => {
    v = (v || "").trim();
    if (!v || v === m.content) return;
    const q = new URLSearchParams(location.search);
    if (q.get("v") === v) return;   // 已經在新網址還是舊內容就不要一直跳
    q.set("v", v);
    location.replace(location.pathname + "?" + q.toString() + location.hash);
  }).catch(() => {});
}
window.addEventListener("load", checkUpdate);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });

updateFar();
</script>
