<script>/* 我在哪：每一張 Leaflet 地圖左上角加一顆 📍，按了用手機定位畫藍點＋誤差圈＋面向的扇形（2026-10-25 Leo：「把這個我在哪也加進一日行程、約會行程，還有旅遊書 skill」）。
   用法：整段貼在 leaflet.js 那個 <script> 的「下一行」（inline，單檔也能用）；之後頁面上不管什麼時候建的 L.map 都會自動有這顆鈕。
   - 只在按了按鈕才問定位；按過一次記在 localStorage，下次打開自動開（藍點自己出現，不拉動地圖）
   - 人離這張圖 30 公里以上（例：還在台灣）只寫距離，不把地圖拉走
   - 所有地圖共用同一個定位，走動時藍點跟著移
   2026-11-07 Leo：「現在位置沒有跟著我移動而更新，也沒有朝向我的面向」→
   - 按 📍 之後進入「跟著我」：每次更新地圖都把你置中；自己拖地圖就停止跟隨，再按 📍 恢復（按鈕變深藍＝跟隨中）
   - 不收 15 秒前的舊位置（maximumAge 3 秒）；手機鎖螢幕／切 App 回來會重開定位；20 秒沒更新就主動再要一次
   - 面向：手機指南針（iPhone 要在按 📍 時允許「動作與方向」），沒有指南針就用走路的移動方向；藍點旁的扇形指向你面對的方向 */
(function(){
  var KEY='book-loc', FAR=30000;
  function install(){
    if(!window.L||!('geolocation' in navigator)||L.Map._locHook) return;
    L.Map._locHook=true;
    var css=document.createElement('style');
    css.textContent='.loc-btn{font-size:17px;line-height:30px!important;text-align:center;text-decoration:none}'+
      '.loc-btn.on{background:#e8f0fd!important}'+
      '.loc-btn.follow{background:#2f80ed!important}'+
      '.loc-msg{background:rgba(255,255,255,.95);border-radius:8px;padding:5px 9px;font:600 12.5px/1.5 system-ui,sans-serif;color:#2b2a26;box-shadow:0 1px 4px rgba(0,0,0,.25);max-width:230px}'+
      '.me-ic{background:none;border:0}'+
      '.me-wrap{position:relative;width:64px;height:64px;pointer-events:auto}'+
      '.me-wrap .me-cone{position:absolute;inset:0;border-radius:50%;display:none;'+
        'background:conic-gradient(from -30deg,rgba(47,128,237,.75) 0deg 60deg,transparent 60deg 360deg);'+
        '-webkit-mask:radial-gradient(circle,#000 0,#000 22%,rgba(0,0,0,.5) 45%,transparent 70%);mask:radial-gradient(circle,#000 0,#000 22%,rgba(0,0,0,.5) 45%,transparent 70%)}'+
      '.me-wrap .me-dot{position:absolute;left:23px;top:23px;width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:#2f80ed;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 1px 4px rgba(0,0,0,.35)}'+
      '.me-wrap .me-dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:rgba(47,128,237,.35);animation:mepulse 2s ease-out infinite}'+
      '@keyframes mepulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}'+
      '@media (prefers-reduced-motion:reduce){.me-wrap .me-dot::after{animation:none}}';
    document.head.appendChild(css);
    var maps=[], last=null, lastT=0, watch=null, head=null, compass=false, oriOn=false;
    var OPT={enableHighAccuracy:true,maximumAge:3000,timeout:20000};
    function dist(d){return d<1000?Math.round(d)+' 公尺':(d/1000).toFixed(d<10000?1:0)+' 公里';}
    function say(m,s){
      if(!m._locMsg){var C=L.Control.extend({options:{position:'bottomleft'},onAdd:function(){var d=L.DomUtil.create('div','loc-msg');L.DomEvent.disableClickPropagation(d);return d;}}); m._locMsg=new C(); m.addControl(m._locMsg);}
      var el=m._locMsg.getContainer(); el.textContent=s; el.style.display='';
      clearTimeout(m._locT); m._locT=setTimeout(function(){el.style.display='none';},7000);
    }
    function paintHead(m){
      if(!m._meDot) return; var el=m._meDot.getElement(); if(!el) return;
      var c=el.querySelector('.me-cone'); if(!c) return;
      if(head===null){c.style.display='none';return;}
      c.style.display='block'; c.style.transform='rotate('+head+'deg)';
    }
    function setHead(h){
      h=((h%360)+360)%360;
      if(head!==null){var d=Math.abs(h-head); if(d>180) d=360-d; if(d<3) return;}
      head=h; maps.forEach(paintHead);
    }
    function setFollow(m,on){m._follow=on; if(m._locBtn) m._locBtn.classList.toggle('follow',!!on);}
    function draw(m,pos){
      var ll=L.latLng(pos.coords.latitude,pos.coords.longitude), acc=Math.min(pos.coords.accuracy||0,500);
      if(!m._meDot){
        m._meRing=L.circle(ll,{radius:acc,color:'#2f80ed',weight:1,opacity:.5,fillColor:'#2f80ed',fillOpacity:.12,interactive:false}).addTo(m);
        m._meDot=L.marker(ll,{icon:L.divIcon({className:'me-ic',html:'<div class="me-wrap"><div class="me-cone"></div><div class="me-dot"></div></div>',iconSize:[64,64],iconAnchor:[32,32],popupAnchor:[0,-12]}),zIndexOffset:1000,keyboard:false}).addTo(m).bindPopup('你在這裡');
        paintHead(m);
      }else{m._meDot.setLatLng(ll); m._meRing.setLatLng(ll).setRadius(acc);}
      var far=m.getCenter().distanceTo(ll);
      if(m._locFollow){
        m._locFollow=false;
        if(far>FAR){setFollow(m,false); say(m,'你不在這張圖的範圍（離這裡約 '+dist(far)+'），到了就會出現藍點。');}
        else{m._panning=true; m.setView(ll,Math.max(m.getZoom(),17)); m._panning=false; say(m,'藍點是你（誤差約 '+dist(acc)+'）；地圖會跟著你走，拖地圖就停，再按 📍 恢復'+(compass?'':'。扇形＝你面對的方向（沒出現就是沒允許指南針，或站著不動）'));}
      }else if(m._follow&&far<FAR){m._panning=true; m.panTo(ll,{animate:true,duration:.5}); m._panning=false;}
    }
    function got(pos){
      last=pos; lastT=Date.now();
      var c=pos.coords;
      if(!compass&&c.heading!=null&&!isNaN(c.heading)&&(c.speed||0)>0.6) setHead(c.heading);
      maps.forEach(function(m){m.whenReady(function(){draw(m,pos);});});
    }
    function bad(e){
      var s=e.code===1?'沒有允許定位。iPhone：設定 → 隱私權與安全性 → 定位服務 → Safari 網站 → 使用 App 期間，再重新整理。'
                       :'暫時抓不到定位（室內或訊號差），走到外面會自己更新。';
      maps.forEach(function(m){if(m._locFollow){m._locFollow=false; say(m,s);}});
      if(e.code===1){try{localStorage.removeItem(KEY);}catch(x){} stopWatch();
        maps.forEach(function(m){if(m._locBtn)m._locBtn.classList.remove('on'); setFollow(m,false);});}
    }
    function stopWatch(){if(watch!==null) navigator.geolocation.clearWatch(watch); watch=null;}
    function startWatch(){stopWatch(); watch=navigator.geolocation.watchPosition(got,bad,OPT);}
    function onOri(e){
      var h=null;
      if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading)) h=e.webkitCompassHeading;
      else if(e.absolute&&typeof e.alpha==='number') h=360-e.alpha;
      if(h===null) return;
      var a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
      compass=true; setHead(h+a);
    }
    function startOri(){
      if(oriOn) return;
      var go=function(){oriOn=true; window.addEventListener('deviceorientationabsolute',onOri,true); window.addEventListener('deviceorientation',onOri,true);};
      try{
        if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
          DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted') go();}).catch(function(){});
        }else go();
      }catch(x){}
    }
    function start(){
      if(watch!==null) return;
      startWatch();
      maps.forEach(function(m){if(m._locBtn)m._locBtn.classList.add('on');});
      try{localStorage.setItem(KEY,'1');}catch(x){}
    }
    // 手機鎖螢幕／切走再回來：iPhone 的 watchPosition 常常就停了，重開一次
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&watch!==null){startWatch(); navigator.geolocation.getCurrentPosition(got,function(){},{enableHighAccuracy:true,maximumAge:0,timeout:15000});}});
    // 20 秒沒有新位置就主動要一次
    setInterval(function(){if(watch!==null&&document.visibilityState==='visible'&&Date.now()-lastT>20000) navigator.geolocation.getCurrentPosition(got,function(){},{enableHighAccuracy:true,maximumAge:0,timeout:15000});},10000);
    L.Map.addInitHook(function(){
      var m=this; maps.push(m);
      m.on('dragstart',function(){if(!m._panning) setFollow(m,false);});
      var C=L.Control.extend({options:{position:'topleft'},onAdd:function(){
        var bar=L.DomUtil.create('div','leaflet-bar'), a=L.DomUtil.create('a','loc-btn'+(watch!==null?' on':''),bar);
        a.href='#'; a.title='我在哪'; a.setAttribute('role','button'); a.setAttribute('aria-label','我在哪'); a.textContent='📍';
        L.DomEvent.on(a,'click',function(ev){L.DomEvent.stop(ev); startOri(); m._locFollow=true; setFollow(m,true);
          if(watch===null){say(m,'第一次按會問能不能用定位（還有指南針），都按「允許」。'); start();}
          else{if(last) draw(m,last); navigator.geolocation.getCurrentPosition(got,function(){},{enableHighAccuracy:true,maximumAge:0,timeout:15000});}});
        L.DomEvent.disableClickPropagation(bar); m._locBtn=a; return bar;}});
      m.addControl(new C());
      if(last) m.whenReady(function(){draw(m,last);});
    });
    window._locStart=function(m){ if(m&&m._locBtn) m._locBtn.click(); };
    try{if(localStorage.getItem(KEY)==='1') start();}catch(x){}
  }
  if(window.L) install(); else document.addEventListener('DOMContentLoaded',install);
})();
</script>
<style>

.must{background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:7px;line-height:18px}
.lock{font-size:11px;color:var(--mut);font-weight:700}
.xd{font-size:10.5px;color:#8a4fb6;font-weight:900}
.st{font-size:10.5px;font-weight:900;color:#fff;background:var(--red);border-radius:6px;padding:0 6px;line-height:18px}
.st.nx{background:#3a7bd5}
.cc-h{font-weight:900;font-size:15.5px;line-height:1.35}
.cc.mv .cc-h{font-size:14px}
.cc.star .cc-h{color:#bf3527}
.cc-t{font:800 12.5px/1.4 Nunito,'Noto Sans TC',sans-serif;color:var(--mut);margin-top:1px}
.cc-x{font-size:13px;color:#4a453c;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.tgs{margin-top:2px}

.cc.open .cc-full{display:block}

.wk-hd{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1.5px solid var(--rule);text-align:center;padding:4px 0 5px;font-size:11px;color:var(--mut);line-height:1.2;cursor:pointer}
.wk-hd b{display:inline-block;font:800 14px/1.1 Nunito,sans-serif;color:var(--ink);padding:2px 6px;border-radius:8px;border:1.5px solid transparent;margin-top:2px}
.wk-hd.sel b{background:var(--grn);border-color:var(--line)}
.wk-hd.today{color:var(--red);font-weight:900}
.wk-hd i{display:block;font-style:normal;font-size:9.5px;font-weight:700}
.wk-corner{position:sticky;left:0;top:0;z-index:5;background:var(--card);border-bottom:1.5px solid var(--rule);border-right:1.5px solid var(--rule)}
.wk-hours{position:sticky;left:0;z-index:4;background:var(--card);border-right:1.5px solid var(--rule)}
.wk-hours span{position:absolute;left:4px;font:800 10px Nunito,sans-serif;color:var(--mut);transform:translateY(-50%)}
.wk-col{position:relative;border-right:1px solid #eee6d6}
.wk-col.sel{background-color:#f6fbf2}
.wb{position:absolute;left:3px;right:3px;background:var(--bgc);border-left:3px solid var(--c);border-radius:6px;padding:1px 4px;font-size:10.5px;line-height:1.25;overflow:hidden;cursor:pointer}
.wb small{font:800 9.5px Nunito,sans-serif;color:#6c6457;display:block}
.wb b{font-weight:700;display:block}
.wb.mv{background:#f7f9f4;font-size:9.5px;color:#6a7a64;padding-top:0}
.wb.star b{color:#bf3527}
.wnow{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}
/* 地圖卡 */
.mc .box-h{background:var(--blue)}
.mc .box-h .s{color:#2e5a73}
.mc-btn{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;flex:none}
.mc-sel{padding:8px 12px;font-size:13px;line-height:1.45;min-height:38px}
.mc-sel b{font-size:14px}

.mk{width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid #222;color:#222;font:900 12px/22px Nunito,sans-serif;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.mk.on{transform:scale(1.35);background:#222;color:#fff}

.mc-list button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:3px 8px 3px 4px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.mc-list button i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--c);font:900 10.5px/18px Nunito,sans-serif;text-align:center;border:1px solid #222}
.mc-list button.on{background:#222;color:#fff}
.mc-note{font-size:11.5px;color:var(--mut);padding:0 12px 10px}
/* 其他 */
.big{display:block;width:100%;border:2.5px solid var(--line);background:var(--yel);border-radius:16px;padding:12px;font-weight:900;font-size:15px;text-align:center;text-decoration:none;color:var(--ink);margin-bottom:10px}
.big.w{background:#fff}
.foot{font-size:12px;color:var(--mut);line-height:1.6;margin-top:8px}
.prog{height:12px;border:2px solid var(--line);border-radius:999px;margin:10px 12px 4px;overflow:hidden;background:#fff}
.prog i{display:block;height:100%;background:var(--grn);transition:width .3s}
.rv-h{font-weight:900;font-size:13px;padding:10px 12px 2px;color:var(--mut)}
.rv{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-top:1px dashed #e3dbc9;cursor:pointer}

.rv span{font-size:12.5px;color:var(--mut)}
.rv.ok b{text-decoration:line-through;color:var(--mut)}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}

.leaflet-popup-content{font:13px/1.45 'Noto Sans TC',sans-serif;margin:9px 12px}
</style>

function dur(n){if(n<60)return n+' 分';var h=Math.floor(n/60),r=n%60;return h+' 小時'+(r?' '+r+' 分':'')}
function wk(iso){return WK[new Date(iso+'T12:00:00Z').getUTCDay()]}
function md(iso){var p=iso.split('-');return (+p[1])+'/'+(+p[2])}
function offMin(tz){var s=tz[0]==='-'?-1:1;return s*(parseInt(tz.slice(1,3),10)*60+parseInt(tz.slice(4,6),10))}
function localMin(t,tz){var d=new Date(t+offMin(tz)*60000);return d.getUTCHours()*60+d.getUTCMinutes()}
function absOf(day,it){if(it.m==null)return null;return Date.parse((it.d||day.date)+'T'+hm(it.m)+':00'+(it.tz||D.tz))}
function gmap(p){return p.href||('https://www.google.com/maps/search/?api=1&query='+p.lat+'%2C'+p.lng)}

/* 先算好每一站的絕對時間 */
D.days.forEach(function(day){
  day.items.forEach(function(it,i){
    it.i=i; it.a=absOf(day,it);
    it.ae=it.a==null?null:it.a+((it.e!=null&&!it.d)?(it.e-it.m):30)*60000;
  });
  day.main=day.items.filter(function(x){return !x.d&&x.m!=null});
  /* 結束＝下一站開始的「絕對時間」：跨時區的航班（杜拜 08:55 → 羅馬 12:40）才不會算成 3 小時 45 分 */
  day.main.forEach(function(x,k){var nx=day.main[k+1];if(nx&&nx.a>x.a)x.ae=nx.a});
  var as=day.items.filter(function(x){return x.a!=null});
  day.r0=Math.min.apply(null,as.map(function(x){return x.a}))-3*3600e3;
  day.r1=Math.max.apply(null,as.map(function(x){return x.ae}))+3600e3;
});

/* 這一天現在進行到哪 */
function status(day){
  if(!(NOW>=day.r0&&NOW<=day.r1))return null;
  var as=day.items.filter(function(x){return x.a!=null}).slice().sort(function(p,q){return p.a-q.a});
  var cur=null,nxt=null;
  for(var k=0;k<as.length;k++){if(as[k].a<=NOW)cur=as[k];else{nxt=as[k];break}}
  var tz=(nxt&&nxt.tz)||(cur&&cur.tz)||D.tz;
  return {cur:cur,nxt:nxt,label:'現在 '+hm(localMin(NOW,tz))+'・'+(TZN[tz]||D.tzlabel)};
}

/* ── 單日 ── */
var T0=0,T1=1;
function yOf(m){var f=(m-T0)/(T1-T0);f=Math.max(0,Math.min(1,f));return 'calc(16px + '+f.toFixed(4)+' * (100% - 32px))'}
function cardHTML(it,st){
  var c=CAT[it.cat]||CAT.spot,mv=it.cat==='move';
  var cls='cc'+(mv?' mv':'')+(it.star?' star':'');
  var badge='';
  if(st){
    if(st.cur===it&&st.nxt){cls+=' cur';badge='<span class="st">進行中</span>'}
    else if(st.cur===it&&!st.nxt&&NOW<it.ae){cls+=' cur';badge='<span class="st">進行中</span>'}
    if(st.nxt===it)badge='<span class="st nx">下一站・還有 '+dur(Math.max(1,Math.round((it.a-NOW)/60000)))+'</span>';
    if(it.ae!=null&&it.ae<NOW&&st.cur!==it)cls+=' done';
  }
  var time;
  if(it.m==null)time=esc(it.t);
  else if(it.d)time=hm(it.m);
  else time=hm(it.m)+(it.e!=null?'–'+hm(it.e)+' · '+dur(Math.round((it.ae-it.a)/60000)):'');
  var xd=it.d?'<span class="xd">'+md(it.d)+'（'+wk(it.d)+'）'+(TZN[it.tz]||'')+'</span>':(it.tz&&it.tz!==D.tz?'<span class="xd">'+(TZN[it.tz]||it.tz)+'</span>':'');
  var top='<div class="cc-top"><span class="pill">'+c.n+'</span>'+(it.star?'<span class="must">必去</span>':'')+
    (it.fixed?'<span class="lock">🔒 時間固定</span>':'')+xd+badge+'</div>';
  var body='<div class="cc-h">'+esc(it.h)+'</div><div class="cc-t">'+time+'</div>';
  if(mv){ if(it.chip)body+='<div class="cc-x">'+it.chip+'</div>'; }
  else if(it.tx)body+='<div class="cc-x">'+it.tx+'</div>';
  if(it.warn)body+='<div class="cc-w">⚠️ '+it.warn+'</div>';
  if(it.tags&&it.tags.length)body+='<div class="tgs">'+it.tags.map(function(t){return '<span class="tg">'+esc(t)+'</span>'}).join('')+'</div>';
  var full='';
  if(!mv&&it.chip)full+='<div class="chip">'+it.chip+'</div>';
  if(mv&&it.tx)full+='<div class="cc-x">'+it.tx+'</div>';
  if(it.alts){full+='<details class="sub"><summary>'+esc(it.alts.title)+'</summary>'+it.alts.opts.map(function(o){
      return '<div class="opt"><b>'+esc(o.h)+'</b><div>'+o.tx+'</div>'+(o.pins.length?'<div class="btns">'+o.pins.map(function(p){
        return '<a class="pbtn" href="'+esc(gmap(p))+'" target="_blank" rel="noopener">📍 '+esc(p.name)+'</a>'}).join('')+'</div>':'')+'</div>'}).join('')+'</details>'}
  if(it.more)full+='<details class="sub"><summary>'+esc(it.more.title)+'</summary>'+it.more.html+'</details>';
  if(it.pins.length)full+='<div class="btns">'+it.pins.map(function(p){return '<a class="pbtn" href="'+esc(gmap(p))+'" target="_blank" rel="noopener">📍 '+esc(p.name)+'</a>'}).join('')+
    '<button class="pbtn alt" data-gomap="1">🗺️ 下面地圖</button></div>';
  var hint=(it.alts||it.more||(!mv&&it.chip)||it.pins.length)?'<div class="cc-more">點開：'+[(!mv&&it.chip)?'交通':'',it.pins.length?'地圖':'',it.alts?'備案':'',it.more?'說明':''].filter(Boolean).join('・')+' ▾</div>':'';
  return '<div class="'+cls+'" data-i="'+it.i+'" style="--c:'+c.c+';--bgc:'+c.bg+'">'+top+body+hint+'<div class="cc-full">'+full+'</div></div>';
}
function renderDay(){
  var day=curDay(),st=status(day),list=$('#list'),ruler=$('#ruler');
  var main=day.main;
  T0=main.length?main[0].m:0; T1=0;
  main.forEach(function(x){T0=Math.min(T0,x.m);T1=Math.max(T1,x.e!=null?x.e:x.m+30)});
  if(T1<=T0)T1=T0+60;
  /* 卡片 */
  var h='';
  day.items.forEach(function(it){
    if(st&&st.nxt===it)h+='<div class="nowbar">'+st.label+'</div>';
    h+=cardHTML(it,st);
  });
  list.innerHTML=h;
  /* 時間尺 */
  var r='<div class="rax" style="top:'+yOf(T0)+';bottom:16px"></div>';
  var span=(T1-T0)/60,step=span>13?2:1;
  r+='<span class="rl end" style="top:'+yOf(T0)+'">'+hm(T0)+'</span><span class="rl end" style="top:'+yOf(T1)+'">'+hm(T1)+'</span>';
  for(var hh=Math.ceil(T0/60);hh*60<T1;hh+=1){
    var m=hh*60; if(hh%step)continue; if(m-T0<span*4.5||T1-m<span*4.5)continue;
    r+='<span class="rl" style="top:'+yOf(m)+'">'+hm(m)+'</span>';
  }
  main.forEach(function(x){
    var c=CAT[x.cat]||CAT.spot,e=x.e!=null?x.e:x.m+30;
    r+='<i class="rt" data-i="'+x.i+'" style="background:'+c.c+';top:'+yOf(x.m)+';height:calc('+((e-x.m)/(T1-T0)).toFixed(4)+' * (100% - 32px) - 1px)"></i>';
  });
  r+='<div class="rind" id="rind" style="top:'+yOf(T0)+'"></div>';
  if(st){
    var yy=null,cur=st.cur,nxt=st.nxt;
    var isMain=function(x){return x&&!x.d&&x.m!=null};
    if(isMain(cur)&&isMain(nxt))yy=cur.m+(nxt.m-cur.m)*(NOW-cur.a)/(nxt.a-cur.a);
    else if(isMain(cur))yy=cur.m+(NOW-cur.a)/60000;
    else if(isMain(nxt))yy=nxt.m-(nxt.a-NOW)/60000;
    if(yy!=null&&yy>=T0-30&&yy<=T1+30)r+='<div class="rnow" style="top:'+yOf(yy)+'"><span>'+hm(localMin(NOW,(nxt&&nxt.tz)||(cur&&cur.tz)||D.tz))+'</span></div>';
  }
  ruler.innerHTML=r;
  /* 捲到現在／最上面 */
  var nb=list.querySelector('.nowbar'),cu=list.querySelector('.cc.cur');
  list.scrollTop=cu?Math.max(0,cu.offsetTop-10):nb?Math.max(0,nb.offsetTop-90):0;
  if(S.sel!=null){var el=list.querySelector('.cc[data-i="'+S.sel+'"]');if(el){el.classList.add('sel','open');list.scrollTop=Math.max(0,el.offsetTop-10)}}
  syncInd();
}
var indRaf=0;
function syncInd(){
  var list=$('#list'),ind=$('#rind');if(!ind)return;
  var cards=list.querySelectorAll('.cc'),day=curDay(),pick=null;
  for(var k=0;k<cards.length;k++){var c=cards[k];if(c.offsetTop+c.offsetHeight>list.scrollTop+24){pick=day.items[+c.dataset.i];break}}
  if(S.sel!=null)pick=day.items[S.sel]||pick;
  if(pick&&!pick.d&&pick.m!=null){ind.style.display='';ind.style.top=yOf(pick.m)}
  else ind.style.display='none';
}
$('#list').addEventListener('scroll',function(){if(S.sel!=null)return;cancelAnimationFrame(indRaf);indRaf=requestAnimationFrame(syncInd)},{passive:true});
$('#list').addEventListener('click',function(e){
  if(e.target.closest('[data-gomap]')){var c0=e.target.closest('.cc');selectItem(+c0.dataset.i,{});
    document.querySelector('.mc').scrollIntoView({behavior:'smooth',block:'start'});return}
  if(e.target.closest('a,summary,details'))return;
  var c=e.target.closest('.cc');if(!c)return;
  var i=+c.dataset.i;
  if(S.sel===i&&c.classList.contains('open')){c.classList.remove('open','sel');S.sel=null;syncInd();mapSel(null);return}
  selectItem(i,{open:true});
});
$('#ruler').addEventListener('click',function(e){
  var rc=this.getBoundingClientRect(),f=(e.clientY-rc.top-16)/(rc.height-32),m=T0+f*(T1-T0);
  var best=null;curDay().main.forEach(function(x){var e2=x.e!=null?x.e:x.m+30;if(m>=x.m&&m<e2)best=x});
  if(!best)curDay().main.forEach(function(x){if(!best||Math.abs(x.m-m)<Math.abs(best.m-m))best=x});
  if(best)selectItem(best.i,{open:true,scroll:true});
});
function selectItem(i,o){
  S.sel=i;var list=$('#list');
  list.querySelectorAll('.cc').forEach(function(c){var me=+c.dataset.i===i;c.classList.toggle('sel',me);if(o.open)c.classList.toggle('open',me)});
  var el=list.querySelector('.cc[data-i="'+i+'"]');
  if(o.scroll&&el)list.scrollTo({top:Math.max(0,el.offsetTop-10),behavior:'smooth'});
  syncInd();mapSel(curDay().items[i]);
}

/* ── 週行事曆 ── */
var PX=0.9;
function renderWeek(){
  var h0=1440,h1=0;
  D.days.forEach(function(d){d.main.forEach(function(x){h0=Math.min(h0,x.m);h1=Math.max(h1,x.e!=null?x.e:x.m+30)})});
  h0=Math.floor(h0/60)*60;h1=Math.min(Math.ceil(h1/60)*60,1560);
  var H=(h1-h0)*PX,n=D.days.length;
  var g='<div class="wk-in" style="grid-template-columns:40px repeat('+n+',104px);grid-template-rows:auto '+H+'px"><div class="wk-corner"></div>';
  D.days.forEach(function(d){g+='<div class="wk-hd'+(d.n===S.day?' sel':'')+(TODAY&&TODAY.n===d.n?' today':'')+'" data-n="'+d.n+'">週'+wk(d.date)+'<br><b>'+md(d.date)+'</b><i>'+esc(d.city)+'</i></div>'});
  g+='<div class="wk-hours" style="grid-row:2;grid-column:1;position:sticky">';
  for(var m=h0+60;m<h1;m+=60)g+='<span style="top:'+((m-h0)*PX)+'px">'+hm(m)+'</span>';
  g+='</div>';
  var lines='background-image:repeating-linear-gradient(to bottom,#ece4d3 0 1px,transparent 1px '+(60*PX)+'px)';
  D.days.forEach(function(d,ci){
    g+='<div class="wk-col'+(d.n===S.day?' sel':'')+'" style="grid-row:2;grid-column:'+(ci+2)+';'+lines+'">';
    d.main.forEach(function(x){
      var c=CAT[x.cat]||CAT.spot,e=x.e!=null?x.e:x.m+30,top=(x.m-h0)*PX,ht=Math.max((e-x.m)*PX-2,12),mv=x.cat==='move';
      g+='<div class="wb'+(mv?' mv':'')+(x.star?' star':'')+'" data-n="'+d.n+'" data-i="'+x.i+'" style="--c:'+c.c+';--bgc:'+c.bg+';top:'+top+'px;height:'+ht+'px">'+
        (mv?esc(x.h):'<small>'+hm(x.m)+(x.fixed?' 🔒':'')+'</small><b>'+esc(x.h)+'</b>')+'</div>';
    });
    if(TODAY&&TODAY.n===d.n){var nm=localMin(NOW,D.tz);if(nm>=h0&&nm<=h1)g+='<div class="wnow" style="top:'+((nm-h0)*PX)+'px"></div>'}
    g+='</div>';
  });
  g+='</div>';
  var wv=$('#weekView');wv.innerHTML=g;
  var day=curDay(),col=wv.querySelectorAll('.wk-col')[S.day-1];
  wv.scrollLeft=Math.max(0,col.offsetLeft-44);
  wv.scrollTop=Math.max(0,((day.main[0]?day.main[0].m:h0)-h0)*PX-10);
}
$('#weekView').addEventListener('click',function(e){
  var b=e.target.closest('.wb');
  if(b){S.day=+b.dataset.n;LS.set('pit-day',S.day);S.sel=+b.dataset.i;S.view='day';LS.set('pit-view','day');render();return}
  var hd=e.target.closest('.wk-hd');if(hd){S.day=+hd.dataset.n;LS.set('pit-day',S.day);S.sel=null;S.view='day';LS.set('pit-view','day');render()}

/* ── 地圖 ── */
var MAP=null,LAYER=null,MK={},DAYPTS=[];
function initMap(){
  if(!window.L)return;
  MAP=L.map('map',{zoomSnap:0.25,scrollWheelZoom:false});
  var fails=0,osm=false;
  var esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:18,attribution:'Tiles © Esri'}).addTo(MAP);
  esri.on('tileerror',function(){if(++fails>=4&&!osm){osm=true;MAP.removeLayer(esri);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP)}});
  LAYER=L.layerGroup().addTo(MAP);
  $('#fit').onclick=function(){fitDay()};
}
function mkIcon(n,c,on){return L.divIcon({className:'',html:'<div class="mk'+(on?' on':'')+'" style="--c:'+c+'">'+n+'</div>',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-12]})}
function mapDay(){
  var day=curDay();
  $('#mcT').textContent='Day '+day.n+'・'+md(day.date)+'（'+wk(day.date)+'）地圖';
  if(!MAP)return;
  LAYER.clearLayers();MK={};DAYPTS=[];
  var order=[],seq=[];
  day.items.forEach(function(it){
    it.pins.forEach(function(p,k){
      if(!MK[p.label]){
        var n=order.length+1,c=(CAT[it.cat]||CAT.spot).c;
        order.push({p:p,n:n,c:c,it:it});
        var m=L.marker([p.lat,p.lng],{icon:mkIcon(n,c,false)}).addTo(LAYER);
        m.bindPopup('<b>'+n+'. '+esc(p.name)+'</b><br>'+hm(it.m==null?0:it.m)+' '+esc(it.h)+'<br><a href="'+esc(gmap(p))+'" target="_blank" rel="noopener">開 Google 地圖 ↗</a>');
        m.on('click',function(){selectItem(it.i,{open:true,scroll:true})});
        MK[p.label]={m:m,n:n,c:c};
      }
      if(k===0){var last=seq[seq.length-1];if(!last||last[0]!==p.lat||last[1]!==p.lng)seq.push([p.lat,p.lng])}
    });
  });
  if(seq.length>1)L.polyline(seq,{color:'#262421',weight:2.5,opacity:.55,dashArray:'6 7'}).addTo(LAYER);
  DAYPTS=order.map(function(o){return [o.p.lat,o.p.lng]});
  $('#mcList').innerHTML=order.map(function(o){return '<button data-l="'+esc(o.p.label)+'" data-i="'+o.it.i+'" style="--c:'+o.c+'"><i>'+o.n+'</i>'+esc(o.p.name)+'</button>'}).join('')||'<span class="mc-note" style="padding:0">這天沒有地圖上的點</span>';
  fitDay();
}
function fitDay(){
  if(!MAP||!DAYPTS.length)return;
  /* 只框這一天主要的區域：離中位數 40 公里以外的（機場、外地）照畫但不算進範圍 */
  var num=function(x,y){return x-y},la=DAYPTS.map(function(p){return p[0]}).sort(num),ln=DAYPTS.map(function(p){return p[1]}).sort(num);
  var c=L.latLng(la[la.length>>1],ln[ln.length>>1]);
  var pts=DAYPTS.filter(function(p){return c.distanceTo(p)<40000});if(!pts.length)pts=DAYPTS;
  if(pts.length===1)MAP.setView(pts[0],15);else MAP.fitBounds(pts,{padding:[26,26],maxZoom:16});
}
$('#mcList').addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)selectItem(+b.dataset.i,{open:true,scroll:true})});
var SELMK=null;
function mapSel(it){
  if(SELMK&&MK[SELMK]){var o=MK[SELMK];o.m.setIcon(mkIcon(o.n,o.c,false));o.m.setZIndexOffset(0)}
  SELMK=null;
  document.querySelectorAll('#mcList button').forEach(function(b){b.classList.toggle('on',it&&+b.dataset.i===it.i)});
  if(!it){$('#mcSel').innerHTML='點上面的卡片，地圖會跳到那個地方';return}
  var p=it.pins[0];
  if(!p){$('#mcSel').innerHTML='<b>'+esc(it.h)+'</b>：這一站沒有地圖上的點';return}
  $('#mcSel').innerHTML=(it.m!=null?hm(it.m)+' ':'')+'<b>'+esc(it.h)+'</b>　<a href="'+esc(gmap(p))+'" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a>';
  if(!MAP)return;
  var o2=MK[p.label];
  if(o2){o2.m.setIcon(mkIcon(o2.n,o2.c,true));o2.m.setZIndexOffset(1000);SELMK=p.label}
  MAP.flyTo([p.lat,p.lng],Math.max(MAP.getZoom(),15.5),{duration:.6});
}

/* ── 全部重畫 ── */
function render(){
  var day=curDay();
  document.querySelectorAll('.sd').forEach(function(b){b.classList.toggle('sel',+b.dataset.n===S.day)});
  centerStrip(true);
  document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.view)});
  $('#calSub').textContent=day.date.slice(0,4)+' 年 '+(+day.date.slice(5,7))+' 月';
  $('#dhN').innerHTML='第 '+day.n+' 天・'+md(day.date)+'（'+wk(day.date)+'）<small>'+esc(day.city)+'</small>'+(TODAY&&TODAY.n===day.n?'<span class="tdy">今天</span>':'');
  $('#dhR').textContent=day.route;
  $('#prev').disabled=S.day<=1;$('#next').disabled=S.day>=D.days.length;
  var wv=S.view==='week';
  $('#dayView').hidden=wv;$('#weekView').hidden=!wv;
  $('#dayView').style.display=wv?'none':'';
  if(wv)renderWeek();else renderDay();
  mapDay();
  if(!wv&&S.sel!=null)mapSel(day.items[S.sel]);else mapSel(null);
}

/* ── 要先訂的 ── */
function renderRsv(){
  var done=LS.get('pit-rsv',{}),h='',lastDay=0,ok=0;
  D.rsv.forEach(function(r){
    var k=r.day+'|'+r.h+'|'+r.tag;if(done[k])ok++;
    if(r.day!==lastDay){var d=D.days[r.day-1];h+='<div class="rv-h">第 '+r.day+' 天・'+md(d.date)+'（'+wk(d.date)+'）'+esc(d.city)+'</div>';lastDay=r.day}
    h+='<label class="rv'+(done[k]?' ok':'')+'"><input type="checkbox" data-k="'+esc(k)+'"'+(done[k]?' checked':'')+'><div><b>'+esc(r.h)+'</b><span>'+esc(r.t)+'・'+esc(r.tag)+'</span></div></label>';
  });
  $('#rvList').innerHTML=h;
  $('#rvSub').textContent='已處理 '+ok+' / '+D.rsv.length;
  $('#rvBar').style.width=(D.rsv.length?ok/D.rsv.length*100:0)+'%';
}
$('#rvList').addEventListener('change',function(e){
  var c=e.target;if(!c.dataset.k)return;var done=LS.get('pit-rsv',{});
  if(c.checked)done[c.dataset.k]=1;else delete done[c.dataset.k];LS.set('pit-rsv',done);renderRsv();
});

/* ── 出發前資訊 ── */
$('#infoGrid').innerHTML=INFO.map(function(x){return '<a href="'+D.book+'#'+x[0]+'" target="_blank" rel="noopener">'+x[1]+'<small>'+x[2]+'</small></a>'}).join('');

/* ── 匯出到手機行事曆 ── */
function strip(h){var d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||'').trim()}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function utc(t){return new Date(t).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
function fold(line){var out=[];while(line.length>70){out.push(line.slice(0,70));line=' '+line.slice(70)}out.push(line);return out.join('\r\n')}
var NEV=0;D.days.forEach(function(d){d.items.forEach(function(x){if(x.a!=null)NEV++})});
$('#ics').textContent='📅 加到 iPhone 行事曆（'+NEV+' 個行程）';
$('#ics').onclick=function(){
  var L2=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//travel-book//proto//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(D.title)],stamp=utc(Date.now());
  D.days.forEach(function(d){d.items.forEach(function(x){
    if(x.a==null)return;
    var desc=[strip(x.chip),strip(x.tx),x.warn?'⚠️ '+strip(x.warn):''].filter(Boolean).join('\n');
    var p=x.pins[0];
    L2.push('BEGIN:VEVENT','UID:'+d.id+'-'+x.i+'@travel-book-proto','DTSTAMP:'+stamp,'DTSTART:'+utc(x.a),'DTEND:'+utc(x.ae),
      fold('SUMMARY:'+icsEsc((x.star?'⭐ ':'')+x.h)));
    if(desc)L2.push(fold('DESCRIPTION:'+icsEsc(desc)));
    if(p)L2.push(fold('LOCATION:'+icsEsc(p.name)),fold('URL:'+gmap(p)));
    L2.push('END:VEVENT');
  })});
  L2.push('END:VCALENDAR');
  var blob=new Blob([L2.join('\r\n')],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='italy-barcelona.ics';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
};

initMap();renderRsv();render();
setTimeout(function(){centerStrip(false)},60);
if(!new URLSearchParams(location.search).get('now'))setInterval(function(){
  NOW=Date.now();var d=curDay();
  if(S.view==='day'&&NOW>=d.r0-36e5&&NOW<=d.r1){var l=$('#list'),st=l.scrollTop;renderDay();l.scrollTop=st;syncInd()}
},60000);
})();
</script>
