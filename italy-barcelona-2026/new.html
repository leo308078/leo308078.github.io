<script>/* 我在哪：每一張 Leaflet 地圖左上角加一顆 📍，按了用手機定位畫藍點＋誤差圈＋面向的扇形（2026-10-25 Leo：「把這個我在哪也加進一日行程、約會行程，還有旅遊書 skill」）。
   用法：整段貼在 leaflet.js 那個 <script> 的「下一行」（inline，單檔也能用）；之後頁面上不管什麼時候建的 L.map 都會自動有這顆鈕。
   - 只在按了按鈕才問定位；按過一次記在 localStorage，下次打開自動開（藍點自己出現，不拉動地圖）
   - 人離這張圖 30 公里以上（例：還在台灣）只寫距離，不把地圖拉走
   - 所有地圖共用同一個定位，走動時藍點跟著移
   2026-11-07 Leo：「現在位置沒有跟著我移動而更新，也沒有朝向我的面向」→
   - 按 📍 之後進入「跟著我」：每次更新地圖都把你置中；自己拖地圖就停止跟隨，再按 📍 恢復（按鈕變深藍＝跟隨中）
   - 不收 15 秒前的舊位置（maximumAge 3 秒）；手機鎖螢幕／切 App 回來會重開定位；20 秒沒更新就主動再要一次
   - 面向：手機指南針（iPhone 要在按 📍 時允許「動作與方向」），沒有指南針就用走路的移動方向；藍點旁的扇形指向你面對的方向 */
(function(){
  var KEY='book-loc', FAR=30000;
  function install(){
    if(!window.L||!('geolocation' in navigator)||L.Map._locHook) return;
    L.Map._locHook=true;
    var css=document.createElement('style');
    css.textContent='.loc-btn{font-size:17px;line-height:30px!important;text-align:center;text-decoration:none}'+
      '.loc-btn.on{background:#e8f0fd!important}'+
      '.loc-btn.follow{background:#2f80ed!important}'+
      '.loc-msg{background:rgba(255,255,255,.95);border-radius:8px;padding:5px 9px;font:600 12.5px/1.5 system-ui,sans-serif;color:#2b2a26;box-shadow:0 1px 4px rgba(0,0,0,.25);max-width:230px}'+
      '.me-ic{background:none;border:0}'+
      '.me-wrap{position:relative;width:64px;height:64px;pointer-events:auto}'+
      '.me-wrap .me-cone{position:absolute;inset:0;border-radius:50%;display:none;'+
        'background:conic-gradient(from -30deg,rgba(47,128,237,.75) 0deg 60deg,transparent 60deg 360deg);'+
        '-webkit-mask:radial-gradient(circle,#000 0,#000 22%,rgba(0,0,0,.5) 45%,transparent 70%);mask:radial-gradient(circle,#000 0,#000 22%,rgba(0,0,0,.5) 45%,transparent 70%)}'+
      '.me-wrap .me-dot{position:absolute;left:23px;top:23px;width:18px;height:18px;box-sizing:border-box;border-radius:50%;background:#2f80ed;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 1px 4px rgba(0,0,0,.35)}'+
      '.me-wrap .me-dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:rgba(47,128,237,.35);animation:mepulse 2s ease-out infinite}'+
      '@keyframes mepulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}'+
      '@media (prefers-reduced-motion:reduce){.me-wrap .me-dot::after{animation:none}}';
    document.head.appendChild(css);
    var maps=[], last=null, lastT=0, watch=null, head=null, compass=false, oriOn=false;
    var OPT={enableHighAccuracy:true,maximumAge:3000,timeout:20000};
    function dist(d){return d<1000?Math.round(d)+' 公尺':(d/1000).toFixed(d<10000?1:0)+' 公里';}
    function say(m,s){
      if(!m._locMsg){var C=L.Control.extend({options:{position:'bottomleft'},onAdd:function(){var d=L.DomUtil.create('div','loc-msg');L.DomEvent.disableClickPropagation(d);return d;}}); m._locMsg=new C(); m.addControl(m._locMsg);}
      var el=m._locMsg.getContainer(); el.textContent=s; el.style.display='';
      clearTimeout(m._locT); m._locT=setTimeout(function(){el.style.display='none';},7000);
    }
    function paintHead(m){
      if(!m._meDot) return; var el=m._meDot.getElement(); if(!el) return;
      var c=el.querySelector('.me-cone'); if(!c) return;
      if(head===null){c.style.display='none';return;}
      c.style.display='block'; c.style.transform='rotate('+head+'deg)';
    }
    function setHead(h){
      h=((h%360)+360)%360;
      if(head!==null){var d=Math.abs(h-head); if(d>180) d=360-d; if(d<3) return;}
      head=h; maps.forEach(paintHead);
    }
    function setFollow(m,on){m._follow=on; if(m._locBtn) m._locBtn.classList.toggle('follow',!!on);}
    function draw(m,pos){
      var ll=L.latLng(pos.coords.latitude,pos.coords.longitude), acc=Math.min(pos.coords.accuracy||0,500);
      if(!m._meDot){
        m._meRing=L.circle(ll,{radius:acc,color:'#2f80ed',weight:1,opacity:.5,fillColor:'#2f80ed',fillOpacity:.12,interactive:false}).addTo(m);
        m._meDot=L.marker(ll,{icon:L.divIcon({className:'me-ic',html:'<div class="me-wrap"><div class="me-cone"></div><div class="me-dot"></div></div>',iconSize:[64,64],iconAnchor:[32,32],popupAnchor:[0,-12]}),zIndexOffset:1000,keyboard:false}).addTo(m).bindPopup('你在這裡');
        paintHead(m);
      }else{m._meDot.setLatLng(ll); m._meRing.setLatLng(ll).setRadius(acc);}
      var far=m.getCenter().distanceTo(ll);
      if(m._locFollow){
        m._locFollow=false;
        if(far>FAR){setFollow(m,false); say(m,'你不在這張圖的範圍（離這裡約 '+dist(far)+'），到了就會出現藍點。');}
        else{m._panning=true; m.setView(ll,Math.max(m.getZoom(),17)); m._panning=false; say(m,'藍點是你（誤差約 '+dist(acc)+'）；地圖會跟著你走，拖地圖就停，再按 📍 恢復'+(compass?'':'。扇形＝你面對的方向（沒出現就是沒允許指南針，或站著不動）'));}
      }else if(m._follow&&far<FAR){m._panning=true; m.panTo(ll,{animate:true,duration:.5}); m._panning=false;}
    }
    function got(pos){
      last=pos; lastT=Date.now();
      var c=pos.coords;
      if(!compass&&c.heading!=null&&!isNaN(c.heading)&&(c.speed||0)>0.6) setHead(c.heading);
      maps.forEach(function(m){m.whenReady(function(){draw(m,pos);});});
    }
    function bad(e){
      var s=e.code===1?'沒有允許定位。iPhone：設定 → 隱私權與安全性 → 定位服務 → Safari 網站 → 使用 App 期間，再重新整理。'
                       :'暫時抓不到定位（室內或訊號差），走到外面會自己更新。';
      maps.forEach(function(m){if(m._locFollow){m._locFollow=false; say(m,s);}});
      if(e.code===1){try{localStorage.removeItem(KEY);}catch(x){} stopWatch();
        maps.forEach(function(m){if(m._locBtn)m._locBtn.classList.remove('on'); setFollow(m,false);});}
    }
    function stopWatch(){if(watch!==null) navigator.geolocation.clearWatch(watch); watch=null;}
    function startWatch(){stopWatch(); watch=navigator.geolocation.watchPosition(got,bad,OPT);}
    function onOri(e){
      var h=null;
      if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading)) h=e.webkitCompassHeading;
      else if(e.absolute&&typeof e.alpha==='number') h=360-e.alpha;
      if(h===null) return;
      var a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
      compass=true; setHead(h+a);
    }
    function startOri(){
      if(oriOn) return;
      var go=function(){oriOn=true; window.addEventListener('deviceorientationabsolute',onOri,true); window.addEventListener('deviceorientation',onOri,true);};
      try{
        if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
          DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted') go();}).catch(function(){});
        }else go();
      }catch(x){}
    }
    function start(){
      if(watch!==null) return;
      startWatch();
      maps.forEach(function(m){if(m._locBtn)m._locBtn.classList.add('on');});
      try{localStorage.setItem(KEY,'1');}catch(x){}
    }
    // 手機鎖螢幕／切走再回來：iPhone 的 watchPosition 常常就停了，重開一次
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&watch!==null){startWatch(); navigator.geolocation.getCurrentPosition(got,function(){},{enableHighAccuracy:true,maximumAge:0,timeout:15000});}});
    // 20 秒沒有新位置就主動要一次
    setInterval(function(){if(watch!==null&&document.visibilityState==='visible'&&Date.now()-lastT>20000) navigator.geolocation.getCurrentPosition(got,function(){},{enableHighAccuracy:true,maximumAge:0,timeout:15000});},10000);
    L.Map.addInitHook(function(){
      var m=this; maps.push(m);
      m.on('dragstart',function(){if(!m._panning) setFollow(m,false);});
      var C=L.Control.extend({options:{position:'topleft'},onAdd:function(){
        var bar=L.DomUtil.create('div','leaflet-bar'), a=L.DomUtil.create('a','loc-btn'+(watch!==null?' on':''),bar);
        a.href='#'; a.title='我在哪'; a.setAttribute('role','button'); a.setAttribute('aria-label','我在哪'); a.textContent='📍';
        L.DomEvent.on(a,'click',function(ev){L.DomEvent.stop(ev); startOri(); m._locFollow=true; setFollow(m,true);
          if(watch===null){say(m,'第一次按會問能不能用定位（還有指南針），都按「允許」。'); start();}
          else{if(last) draw(m,last); navigator.geolocation.getCurrentPosition(got,function(){},{enableHighAccuracy:true,maximumAge:0,timeout:15000});}});
        L.DomEvent.disableClickPropagation(bar); m._locBtn=a; return bar;}});
      m.addControl(new C());
      if(last) m.whenReady(function(){draw(m,last);});
    });
    window._locStart=function(m){ if(m&&m._locBtn) m._locBtn.click(); };
    try{if(localStorage.getItem(KEY)==='1') start();}catch(x){}
  }
  if(window.L) install(); else document.addEventListener('DOMContentLoaded',install);
})();
</script>
<style>
:root{color-scheme:light;--bg:#fbf7ee;--ink:#262421;--mut:#857f73;--line:#262421;--card:#fffdf8;--yel:#f2c862;--blue:#acd5ec;--grn:#a6d590;--grnd:#4f8f3c;--red:#e04436;--rule:#e6dfcf;
  --bodyH:clamp(380px,calc(100svh - 300px),600px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:#2f6db5}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
/* 頁首 */
.hd{display:flex;align-items:flex-end;gap:10px}
.hd-l{flex:1;min-width:0}
.kick{font:800 10.5px/1.4 Nunito,sans-serif;letter-spacing:.18em;color:var(--mut)}
h1{font:900 clamp(22px,6.6vw,29px)/1.15 'Noto Sans TC',sans-serif;margin:4px 0 3px;letter-spacing:.03em;white-space:nowrap}
.cities{font-size:12.5px;color:var(--mut)}
.hd-art{font-size:22px;line-height:1;letter-spacing:-4px;padding-bottom:6px}
.stats{display:flex;margin:12px 0 0;border:2px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.stat{flex:1;padding:7px 4px 6px;text-align:center;border-right:1.5px dashed #d8d0bf}
.stat:last-child{border-right:0}
.stat b{display:block;font:900 21px/1.1 Nunito,sans-serif}
.stat span{font-size:11px;color:var(--mut)}
.stat.cd b{color:var(--red)}
/* 現在時間 */
.clock{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.clock b{font:900 15px Nunito,'Noto Sans TC',sans-serif;color:var(--ink)}
.clock .sep{color:#cfc6b2}
.clock button{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.pv{margin-top:10px;background:#fff1c2;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pv[hidden]{display:none}
.pv button{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-size:12.5px;font-weight:700}
/* 分頁 */
.tabs{display:flex;gap:6px;margin:14px 0 12px}
.tabs button{flex:1;border:2px solid transparent;background:none;border-radius:999px;padding:7px 0;font-weight:700;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--grn);border-color:var(--line);color:var(--ink)}
.tab{display:none}.tab.on{display:block}
/* 卡片框 */
.box{background:var(--card);border:2.5px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:16px}
.box-h{background:var(--yel);padding:9px 12px 9px 14px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--line)}
.box-h .t{font-weight:900;font-size:18px;line-height:1.2}
.box-h .s{font:800 10.5px Nunito,sans-serif;letter-spacing:.08em;color:#6b5a2a;display:block}
.seg{margin-left:auto;display:flex;background:#fff4cf;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:6px 9px;font-size:12.5px;font-weight:700;color:#6b5a2a}
.seg button.on{background:#5a4513;color:#fff}
/* 日期列（捷運路線） */
.strip{overflow-x:auto;scrollbar-width:none;border-bottom:1.5px dashed #d9d0bd}
.strip::-webkit-scrollbar{display:none}
.strip-in{display:flex;position:relative;padding:4px 10px 8px;width:max-content}
.strip-in::before{content:'';position:absolute;left:35px;right:35px;top:48px;height:2px;background:var(--line)}
.sd{position:relative;width:50px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.sd-ic{height:24px;font-size:18px;line-height:24px}
.sd-city{height:14px;font-size:9.5px;line-height:14px;color:var(--mut);white-space:nowrap;font-weight:700}
.sd-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:var(--card);margin:3px 0 4px;position:relative;z-index:1}
.sd-w{font-size:11px;color:var(--mut);line-height:1.3}
.sd-d{font:800 15px/1 Nunito,sans-serif;padding:4px 6px;border-radius:9px;margin-top:2px;border:1.5px solid transparent;min-width:28px;text-align:center}
.sd.sel .sd-d{background:var(--grn);border-color:var(--line)}
.sd.sel .sd-dot{background:var(--grnd)}
.sd.today .sd-w{color:var(--red);font-weight:900}
.sd.adj .sd-dot{border-color:var(--red)}
.strip.vers .strip-in{width:auto;gap:8px;padding:10px 12px}
.strip.vers .strip-in::before{display:none}
.sd.sdv{flex:1;width:auto;display:block;border:1.5px solid #cfc6b2;border-radius:14px;background:#fff;padding:8px 6px;font-size:13.5px;font-weight:700;line-height:1.35;text-align:center}
.sd.sdv b{display:block;font:900 17px/1.1 Nunito,sans-serif;margin-bottom:2px}
.sd.sdv.sel{background:var(--grn);border-color:var(--line)}
/* 這一天的標題 */
.dh{display:flex;align-items:flex-start;gap:8px;padding:9px 12px 6px}
.dh-m{flex:1;min-width:0}
.dh-n{font-weight:900;font-size:16.5px;line-height:1.35}
.dh-n small{font-size:12px;color:var(--mut);font-weight:700;margin-left:4px}
.bdg{color:#fff;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px;background:var(--red);white-space:nowrap}
.bdg.adj{background:#a0522d}
.dh-r{font-size:12.5px;color:var(--mut);line-height:1.45;margin-top:2px}
.nav{display:flex;gap:6px;flex:none;padding-top:2px}
.nav button{width:34px;height:34px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:900}
.nav button:disabled{opacity:.3}
/* 每天的小按鈕（重點／照片／天氣／飯店／調整時間）：點了才展開，不佔高度 */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;border:1.5px solid #cfc6b2;background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chipb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chipb.adjon{background:#a0522d;border-color:#a0522d;color:#fff}
.panel{margin:0 12px 10px;border:1.5px dashed #d6ccb8;border-radius:14px;padding:9px 12px;font-size:13.5px;line-height:1.6;max-height:280px;overflow:auto;background:#fffefb}
.panel[hidden]{display:none}
.panel ul{margin:6px 0 0;padding-left:18px}
.panel li{margin:3px 0}
.panel .pt{font-weight:900;margin-bottom:2px}
.phs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}
.phs figure{margin:0;flex:none;width:min(80%,300px);scroll-snap-align:start}
.phs img{width:100%;height:175px;object-fit:contain;background:#f1ece0;border-radius:10px;display:block}
.phs figcaption{font-size:12px;color:var(--mut);line-height:1.4;margin-top:4px}
.phs figcaption b{color:var(--ink)}
.wxrow{display:flex;align-items:center;gap:10px}
.wxrow .ic{font-size:30px}
.wxrow b{font:900 18px Nunito,sans-serif}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* 單日：左邊整天時間尺（不捲）＋右邊卡片（捲） */
.body{height:var(--bodyH);display:grid;grid-template-columns:52px 1fr;border-top:1.5px solid var(--rule)}
.ruler{position:relative;border-right:1.5px dashed #ddd4c1;background:#fcf9f1;cursor:pointer;overflow:hidden}
.rl{position:absolute;left:3px;font:800 10px/1 Nunito,sans-serif;color:var(--mut);transform:translateY(-50%)}
.rl.end{color:var(--ink)}
.rax{position:absolute;left:38px;width:1.5px;background:#cfc6b2}
.rt{position:absolute;left:36px;width:6px;border-radius:3px;min-height:3px}
.rt.sk{opacity:.25}
.rind{position:absolute;left:31px;width:16px;height:16px;border-radius:50%;background:#fff;border:2.5px solid var(--line);transform:translateY(-50%);transition:top .25s;z-index:2}
.rnow{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3}
.rnow span{position:absolute;left:1px;top:-8px;background:var(--red);color:#fff;font:900 10px/16px Nunito,sans-serif;padding:0 4px;border-radius:5px}
.list{overflow-y:auto;position:relative;padding:10px 11px 70px 10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.cc{position:relative;background:#fff;border:2px solid var(--line);border-left:7px solid var(--c);border-radius:15px;padding:8px 11px 9px;margin-bottom:9px;cursor:pointer}
.cc.mv{background:#fbfdf8;border-width:1.5px;border-left-width:7px;padding:6px 11px 7px}
.cc.sel{box-shadow:0 0 0 3px var(--bgc),0 0 0 4.5px var(--c)}
.cc.cur{background:#fff7d1}
.cc.done{opacity:.62}
.cc.skip{opacity:.45}

e": false}, {"day": 10, "h": "奎爾公園（紀念區）", "tag": "🎫 先上網買", "t": "10:30", "done": false}, {"day": 11, "h": "午餐：Can Solé（海鮮燉飯）", "tag": "📞 先訂位", "t": "13:30", "done": false}, {"day": 11, "h": "晚餐：7 Portes", "tag": "📞 先訂 19:30", "t": "19:15", "done": false}], "info": [{"id": "info", "title": "✈️ 航班與住宿", "html": "\n<div class=\"kv\"><div class=\"k\">去程<\/div><div class=\"v\"><b>12/25 (五) 23:00 桃園 T2 → 12/26 04:45 杜拜 T3<\/b>｜阿聯酋 EK367<br>\n<b>12/26 (六) 08:55 杜拜 T3 → 12:40 羅馬 Fiumicino（FCO）T3<\/b>｜EK097<br>\n<small>杜拜轉機 4 小時，同一張票，行李直掛羅馬，不用出關。<\/small><\/div><\/div>\n<div class=\"kv\"><div class=\"k\">回程<\/div><div class=\"v\"><b>1/6 (三) 15:05 巴塞隆納 El Prat（BCN）T1 → 1/7 00:30 杜拜 T3<\/b>｜EK256<br>\n<b>1/7 (四) 03:40 杜拜 T3 → 15:35 桃園 T2<\/b>｜EK366<br>\n<small>1/6 是西班牙三王節國定假日，機場巴士照開但店多半關，<b>11:20 出發去機場<\/b>（杜拜不是申根區，要過出境查驗）。<\/small><\/div><\/div>\n<div class=\"kv\"><div class=\"k\">還沒訂<\/div><div class=\"v\"><b>1/2 義大利 → 巴塞隆納的機票<\/b>、全部住宿、兩段高鐵。建議班次和飯店寫在下面「出發前要做的事」。<\/div><\/div>\n<div class=\"kv\"><div class=\"k\">住哪<\/div><div class=\"v\">\n羅馬 3 晚（12/26–28）｜拿波里 2 晚（12/29–30）｜佛羅倫斯 2 晚（12/31–1/1）｜巴塞隆納 4 晚（1/2–1/5）<br>\n<small>地圖上的 🏨 是書裡建議的那家（還沒訂）。訂了別家，跟我說就換。<\/small><\/div><\/div>\n<div class=\"kv\"><div class=\"k\">時差<\/div><div class=\"v\">義大利、西班牙都比台灣<b>慢 7 小時<\/b>（台灣晚上 8 點＝當地下午 1 點）。杜拜比台灣慢 4 小時。<\/div><\/div>\n<div class=\"kv\"><div class=\"k\">插頭<\/div><div class=\"v\">歐規<b>圓頭兩孔<\/b>（義大利還有三孔一排的），台灣扁頭插不進去 → 帶<b>轉接頭<\/b>。電壓 230V：手機、相機充電器 OK；<b>台灣的吹風機、離子夾不能直接插<\/b>（會燒），飯店都有吹風機。<\/div><\/div>\n<div class=\"kv\"><div class=\"k\">入境<\/div><div class=\"v\">台灣護照免簽 90 天。<b>ETIAS（歐盟旅行授權）還沒開始<\/b>（2026/11/8 歐盟官網：還沒收件，開始前幾個月會公告）→ 這趟不用申請，出發前一週再看 <a href=\"https://travel-europe.europa.eu/etias_en\" target=\"_blank\">官網<\/a> 一次；網路上收費代辦的都是假的。第一次進歐盟要在機器按指紋、拍照（EES 出入境系統），羅馬入境排隊抓 30–60 分。<\/div><\/div>\n"}, {"id": "booking", "title": "📋 出發前要做的事", "html": "\n<div class=\"alert warn\"><b>還沒訂的：住宿、義大利飛巴塞隆納的機票、兩段高鐵、所有門票。<\/b>聖誕跨年是旺季，<b>越早訂越便宜、越有位子<\/b>。下面照「多急」排。<\/div>\n\n<h3 style=\"margin:14px 0 6px\">🏨 建議住宿（2026/11/8 Booking 查，兩人一間、每晚台幣）<\/h3>\n<div class=\"ptbl-wrap\"><table class=\"ptbl\" style=\"min-width:640px\">\n<thead><tr><th>城市（晚數）<\/th><th>建議這家<\/th><th>便宜一點的<\/th><th>為什麼住這區<\/th><\/tr><\/thead><tbody>\n<tr><th class=\"rl\">羅馬<br>12/26–29（3 晚）<\/th><td><b>Hotel Viminale<\/b><br>9.3 分（2,045 則）約 8,600<\/td><td>Hotel Santa Maria Maggiore 8.8 分 約 4,900<br>Ruby Giulia 9.1 分 約 6,200（多半只有大床）<\/td><td>Termini 車站走 10 分、競技場走 15 分；12/29 早上走路去搭高鐵<\/td><\/tr>\n<tr><th class=\"rl\">拿波里<br>12/29–31（2 晚）<\/th><td><b>Soul Art Hotel<\/b><br>8.8 分（661 則）約 6,700<\/td><td>Hotel Il Convento 9.1 分 約 7,000（西班牙區巷子裡，比較熱鬧）<\/td><td>就在 Toledo 大街、地鐵 Toledo 站走 3 分，晚上回來路比較亮<\/td><\/tr>\n<tr><th class=\"rl\">佛羅倫斯<br>12/31–1/2（2 晚）<\/th><td><b>c-hotels Diplomat<\/b><br>9.2 分（3,357 則）約 6,300<\/td><td>c-hotels Joy 9.4 分 約 6,200（同一條街）<\/td><td>新聖母車站走 3 分：到站、去比薩、去機場電車都在門口<\/td><\/tr>\n<tr><th class=\"rl\">巴塞隆納<br>1/2–6（4 晚）<\/th><td><b>Hotel Omnium<\/b><br>9.3 分（1,947 則）約 4,700<\/td><td>Hotel Ambit 8.8 分 約 3,900<\/td><td>擴展區（安全、安靜），走路到哥德區、感恩大道都 10–15 分<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<small class=\"muted\">四家加起來每間約 NT$70,000（11 晚），每人約 35,000；<b>住宿稅另外付給飯店<\/b>（每人每晚 €5–8）。訂的時候選<b>可免費取消<\/b>、房型看清楚是 twin（兩張床）還是 double（一張大床）。<\/small>\n\n<h3 style=\"margin:16px 0 6px\">✈️ 義大利 → 巴塞隆納（1/2）建議這班<\/h3>\n<div class=\"opt save\"><div class=\"on\">✈️<\/div><div class=\"d\"><b>佛羅倫斯 FLR 13:10 → 巴塞隆納 14:55｜伏林航空 Vueling 直飛<\/b><span class=\"pr\">每人約 NT$6,500 起<\/span><br>\n飯店走 3 分搭電車 20 分就到機場，不用拖行李轉車；早上還能看烏菲茲；落地是巴塞隆納第 1 航廈（回程那天也是 T1）。<b>最便宜的票只含座位下小包，要另買托運行李<\/b>（每件約 €19–60）。<\/div><\/div>\n<details class=\"alts\"><summary>✈️ 其他選擇（2 班）<\/summary>\n<div class=\"opt\"><div class=\"on\">1<\/div><div class=\"d\"><b>波隆那 BLQ 17:40 → 19:25｜瑞安航空 Ryanair<\/b><span class=\"pr\">約 NT$5,700 起<\/span><br>避開佛羅倫斯機場冬天起霧改降的風險，早上時間比較鬆；但要多坐高鐵到波隆那（38 分，兩人 €58）＋機場輕軌（€12.80／人），拖行李轉兩次；落地第 2 航廈（機場巴士搭 A2）。<\/div><\/div>\n<div class=\"opt\"><div class=\"on\">2<\/div><div class=\"d\"><b>佛羅倫斯 FLR 09:50 → 11:35｜Vueling<\/b><span class=\"pr\">約 NT$4,200 起<\/span><br>最便宜，但就看不到烏菲茲了。<\/div><\/div>\n<div class=\"seg-note\">2026/11/8 用 Google 機票查的單人最便宜票價，會一直變。比薩冬天沒有直飛巴塞隆納。<\/div><\/details>\n\n<h3 style=\"margin:16px 0 6px\">📋 要買的票（照急的順序）<\/h3>\n<table class=\"btab\">\n<tr><th>要做的事<\/th><th>期限<\/th><th>怎麼弄<\/th><\/tr>\n<tr><td>🏨 <b>四個城市的住宿<\/b><\/td><td class=\"r\">🔴 現在<\/td><td>上面那張表，Booking 搜飯店名<\/td><\/tr>\n<tr><td>✈️ <b>1/2 飛巴塞隆納<\/b><\/td><td class=\"r\">🔴 現在<\/td><td>上面那班，Vueling 官網或 Google 機票；加買托運<\/td><\/tr>\n<tr><td>⛪ <b>梵蒂岡博物館<\/b><br>12/28 8:00<\/td><td class=\"r\">🔴 現在<\/td><td><a href=\"https://tickets.museivaticani.va\" target=\"_blank\">官網<\/a> €25，聖誕週幾天內就賣光。小心網域很像的假網站<\/td><\/tr>\n<tr><td>🗿 <b>蒙紗基督（Sansevero）<\/b><br>12/29 12:00<\/td><td class=\"r\">🔴 現在<\/td><td><a href=\"https://ticket.museosansevero.it/en/\" target=\"_blank\">官網<\/a> €12，強制預約、不退不改<\/td><\/tr>\n<tr><td>🗽 <b>大衛像（學院美術館）<\/b><br>12/31 13:30<\/td><td class=\"r\">🔴 現在<\/td><td><a href=\"https://www.galleriaaccademiafirenze.it/en/tickets/\" target=\"_blank\">官網 B-Ticket<\/a> €20＋€4<\/td><\/tr>\n<tr><td>🍝 <b>跨年晚餐 Buca Mario<\/b><br>12/31 19:30<\/td><td class=\"r\">🔴 現在<\/td><td>官網線上訂位；跨年常是固定套餐<\/td><\/tr>\n<tr><td>🗼 <b>比薩斜塔<\/b><br>1/1 13:00<\/td><td class=\"r\">🔴 現在<\/td><td><a href=\"https://www.opapisa.it/en/tickets/buy/\" target=\"_blank\">官網<\/a> €20（附大教堂）<\/td><\/tr>\n<tr><td>🖼️ <b>烏菲茲<\/b><br>1/2 8:15<\/td><td class=\"r\">🔴 現在<\/td><td><a href=\"https://www.uffizi.it/en/tickets\" target=\"_blank\">官網<\/a> €29（記名）<\/td><\/tr>\n<tr><td>⛪ <b>聖家堂<\/b><br>1/3 11:00<\/td><td class=\"r\">🔴 現在<\/td><td><a href=\"https://sagradafamilia.org/en/tickets-individuals\" target=\"_blank\">官網<\/a> €26（登塔 €36，要買時就選）；現場不賣<\/td><\/tr>\n<tr><td>🚄 <b>兩段高鐵<\/b><br>12/29 羅馬 9:20、12/31 拿波里 8:40<\/td><td class=\"y\">🟡 越早越便宜<\/td><td><a href=\"https://www.trenitalia.com/en.html\" target=\"_blank\">Trenitalia<\/a> App，買可以改一次的 Economy<\/td><\/tr>\n<tr><td>🏟️ <b>競技場<\/b><br>12/27 9:00<\/td><td class=\"r\">⏰ <b>11/27 開賣<\/b><\/td><td><a href=\"https://ticketing.colosseo.it/\" target=\"_blank\">官網<\/a> 24h 票 €18；參觀日前 30 天才開賣，<b>那天設鬧鐘<\/b><\/td><\/tr>\n<tr><td>🦎 <b>奎爾公園<\/b> 1/4 10:30<br>🐉 <b>巴特婁之家夜場<\/b> 1/3 18:30<\/td><td class=\"y\">🟡 12 月初前<\/td><td><a href=\"https://parkguell.barcelona/en/buy-tickets\" target=\"_blank\">奎爾公園<\/a> €18；<a href=\"https://www.casabatllo.es/en/online-tickets/\" target=\"_blank\">巴特婁之家<\/a> €39 起<\/td><\/tr>\n<tr><td>🌋 <b>龐貝<\/b> 12/30<\/td><td class=\"y\">🟡 出發前<\/td><td><a href=\"https://pompeii.vivaticket.it/\" target=\"_blank\">官網<\/a> Pompeii Express €20（記名）<\/td><\/tr>\n<tr><td>🍴 <b>要訂位的餐廳<\/b><\/td><td class=\"y\">🟡 出發前<\/td><td>Roscioli 12/26、La Taverna 12/27、Il Gabriello 12/28（電話）、Bar Cañete 1/2、Can Solé 1/5 中午、7 Portes 1/5 晚上、Zà Zà 1/1<\/td><\/tr>\n<tr><td>⛪ 聖彼得圓頂（選配）<br>12/28 12:30<\/td><td class=\"y\">🟡 想爬再買<\/td><td><a href=\"https://www.basilicasanpietro.va/en/products/the-dome\" target=\"_blank\">官網<\/a> 電梯＋320 階 €22<\/td><\/tr>\n<tr><td>📱 歐洲 eSIM、轉接頭、旅平險<\/td><td class=\"y\">🟡 出發前<\/td><td>eSIM 要含義大利＋西班牙；保險要含手機失竊、行李延誤<\/td><\/tr>\n<tr><td>❓ ETIAS、跨年節目、三王節路線<\/td><td class=\"g\">出發前一週<\/td><td>ETIAS 11/8 還沒開始（不用申請）；佛羅倫斯跨年、巴塞隆納遊行路線 12 月中才公布<\/td><\/tr>\n<\/table>\n<small class=\"muted\">🔴 不做會沒票沒位子　🟡 要動手　⏰ 指定日期才開賣。門票合計每人約 €290（不含選配），高鐵＋火車每人約 €110。<\/small>\n"}, {"id": "xmas", "title": "🎄 聖誕・跨年・三王節（這趟的主題）", "html": "\n<div class=\"card\">\n<h3>📅 這趟碰到的節日（店和景點會跟著關）<\/h3>\n<table class=\"ptab\">\n<tr><th>日期<\/th><th>節日<\/th><th>會怎樣<\/th><\/tr>\n<tr><td>12/25 五<\/td><td>聖誕節<\/td><td>在飛機上。義大利幾乎全關<\/td><\/tr>\n<tr><td>12/26 六<\/td><td>聖斯德望日（義大利國定假日）<\/td><td>梵蒂岡博物館休；競技場、萬神殿、街上店多半有開<\/td><\/tr>\n<tr><td>12/27 日<\/td><td>當月最後一個週日<\/td><td>梵蒂岡博物館免費開放 → 會爆滿，所以這本排 12/28<\/td><\/tr>\n<tr><td>12/31 四<\/td><td>跨年夜<\/td><td>很多景點提早關；餐廳改跨年套餐要先訂<\/td><\/tr>\n<tr><td>1/1 五<\/td><td>元旦（義大利國定假日）<\/td><td>競技場、梵蒂岡、烏菲茲、大衛像、龐貝都休 → <b>這天去比薩斜塔<\/b>（有開）<\/td><\/tr>\n<tr><td>1/5 二<\/td><td>三王節前夕（西班牙）<\/td><td>傍晚三王遊行，糕餅店排隊買三王節蛋糕<\/td><\/tr>\n<tr><td>1/6 三<\/td><td>三王節（西班牙、義大利國定假日）<\/td><td>巴塞隆納大部分店關；機場、機場巴士照常<\/td><\/tr>\n<\/table>\n<\/div>\n\n<details open><summary>🎄 聖誕氣氛哪裡最濃<\/summary><div class=\"gbody\">\n<p><b>羅馬・納沃納廣場<\/b>（D1）：整個廣場的聖誕市集，聖誕裝飾、糖果、旋轉木馬，開到 1/6。<br>\n<b>羅馬・聖彼得廣場<\/b>（D3）：每年聖誕放一棵大聖誕樹和真人大小的馬槽場景。<br>\n<b>羅馬・Via Condotti<\/b>（D3）：精品街整條掛滿燈。<br>\n<b>拿波里・聖誕馬槽街<\/b>（D4）：全世界最有名的馬槽人偶街，聖誕到 1/6 最熱鬧。<br>\n<b>拿波里・翁貝托一世長廊<\/b>（D4）：玻璃拱頂下的大聖誕樹。<br>\n<b>巴塞隆納・三王節遊行<\/b>（D11）：花車、樂隊、撒糖果，是西班牙小孩一年最期待的晚上。<\/p>\n<\/div><\/details>\n\n<details open><summary>🎆 佛羅倫斯跨年（D6）怎麼過<\/summary><div class=\"gbody\">\n<p><b>先講清楚<\/b>：佛羅倫斯<b>沒有官方煙火<\/b>，市府還禁止在公共場所放煙火爆竹、不能帶玻璃瓶。熱鬧在廣場的免費演唱會。<\/p>\n<p><b>去年（2025→26）的節目<\/b>：聖十字廣場主舞台 21:00–01:00 演唱會（電視直播）；領主廣場接近午夜在舊宮立面投影倒數；大教堂廣場福音詩歌；Carmine 廣場爵士（額滿為止）。<b>今年的節目 12 月中下旬才公布<\/b>，到時看 <a href=\"https://www.comune.firenze.it/\" target=\"_blank\">佛羅倫斯市府<\/a>。<\/p>\n<p><b>這本的排法<\/b>：16:15 米開朗基羅廣場看夕陽 → 回飯店換衣服 → 19:30 跨年晚餐 → 22:30 走去聖十字廣場 → 一起倒數 → 走回飯店（電車整晚有開）。<\/p>\n<p><b>義大利的跨年習俗<\/b>：跨年晚餐吃<b>扁豆（lenticchie）<\/b>，扁豆像錢幣，吃越多明年越有錢；穿<b>紅色內衣<\/b>迎新年會帶來好運（很多店 12 月都在賣）。<\/p>\n<\/div><\/details>\n\n<details><summary>👑 三王節（1/5–1/6）是什麼<\/summary><div class=\"gbody\">\n<p>西班牙小孩收聖誕禮物不是 12/25，是 <b>1/6 早上<\/b>——東方三王（梅爾基奧、加斯帕、巴爾塔薩）騎駱駝帶禮物來。1/5 晚上三王坐船到巴塞隆納港口，市長交給他們一把「魔法鑰匙」（可以打開每一戶的門），接著全城遊行、從花車上撒糖果。<\/p>\n<p><b>三王節蛋糕（Tortell de Reis／Roscón de Reyes）<\/b>：環形的甜麵包，上面有糖漬水果。裡面藏一個<b>小國王公仔<\/b>和一顆<b>蠶豆<\/b>：吃到國王的戴紙皇冠，吃到蠶豆的明年要買蛋糕。1/6 早上吃，<b>1/5 就要先買<\/b>。<\/p>\n<p>義大利這天叫 <b>Befana<\/b>：一個騎掃把的好心巫婆，晚上把糖果放進乖小孩的襪子、給壞小孩煤炭（其實是黑色的糖）。<\/p>\n<\/div><\/details>\n"}, {"id": "guide", "title": "🏛️ 五分鐘看懂（到現場前先讀）", "html": "\n<div class=\"card\"><small class=\"muted\">每段 1 分鐘看完。點開標題看細節。排隊、坐車的時候讀最剛好。<\/small><\/div>\n\n<details open><summary>⛲ 許願池・萬神殿・納沃納廣場（D1）<\/summary><div class=\"gbody\">\n<p><b>許願池（Fontana di Trevi）<\/b>：1762 年完成，中間是海神。傳說<b>背對水池、右手拿硬幣從左肩往後丟<\/b>：一枚＝會再回羅馬，兩枚＝會遇到戀愛，三枚＝會結婚。丟進去的錢每年上百萬歐元，都捐給慈善機構。<\/p>\n<p><b>萬神殿（Pantheon）<\/b>：快兩千年的建築，屋頂是<b>沒有鋼筋的混凝土圓頂<\/b>，到今天還是世界最大的。頂上有個 9 公尺的洞（oculus）沒有玻璃——下雨時雨會直接落進來，地板有排水孔。拉斐爾葬在裡面。<\/p>\n<p><b>納沃納廣場（Piazza Navona）<\/b>：長條形，因為原本是古羅馬的賽跑場。中間是貝尼尼的四河噴泉（四個巨人代表四大洲的四條河）。12 月有聖誕市集。<\/p>\n<\/div><\/details>\n\n<details><summary>🏛️ 羅馬競技場＋古羅馬廣場（D2）<\/summary><div class=\"gbody\">\n<p><b>一句話<\/b>：西元 80 年蓋好的圓形競技場，可以坐 5 萬人看角鬥士、猛獸表演，免費入場、還發麵包——皇帝用來討好市民。<\/p>\n<p><b>現場看哪裡<\/b>：① 一樓往下看地下室（hypogeum）：猛獸和角鬥士在這裡等，用升降機一下子送上場 ② 外牆一半被拆掉——中世紀被當成採石場，羅馬很多教堂的石頭就是從這裡搬的 ③ 出來往古羅馬廣場走，這裡是兩千年前的市中心：凱撒被火化的地方（凱撒神廟）、元老院、凱旋門。<\/p>\n<p><b>帕拉提諾山<\/b>：在廣場旁邊的小山，皇帝住的地方（「palace 宮殿」這個字就是從 Palatino 來的），山頂往下看古羅馬廣場是最好的拍照點。<\/p>\n<\/div><\/details>\n\n<details><summary>⛪ 梵蒂岡：西斯汀禮拜堂＋聖彼得大教堂（D3）<\/summary><div class=\"gbody\">\n<p><b>一句話<\/b>：梵蒂岡是世界最小的國家，教宗住在這裡。博物館是教宗幾百年的收藏，走完全程要 2–3 小時，最後一站是西斯汀禮拜堂。<\/p>\n<p><b>西斯汀禮拜堂<\/b>：米開朗基羅一個人仰著頭畫了 4 年（1508–1512）的天花板。找<b>《創造亞當》<\/b>：上帝跟亞當兩隻手指快碰到的那幅，在天花板中間偏入口那側。正前方整面牆是他 60 歲再回來畫的<b>《最後的審判》<\/b>。裡面<b>禁止拍照、要安靜<\/b>，警衛會一直喊「No photo」。<\/p>\n<p><b>聖彼得大教堂<\/b>：世界最大的教堂之一，圓頂是米開朗基羅設計。一進門右手邊玻璃後面是<b>《聖殤》（Pietà）<\/b>：他 24 歲雕的，聖母抱著死去的耶穌。想爬圓頂：電梯到一半＋爬 320 階，上面看得到整個聖彼得廣場（鑰匙孔的形狀）。<\/p>\n<p><b>服裝<\/b>：<b>肩膀和膝蓋要遮住<\/b>，不然會被擋在門口（冬天穿外套就沒問題，裡面穿細肩帶要注意脫外套）。<\/p>\n<\/div><\/details>\n\n<details><summary>🌋 龐貝古城（D5）<\/summary><div class=\"gbody\">\n<p><b>一句話<\/b>：西元 79 年維蘇威火山爆發，整座城一天之內被火山灰埋掉，1,700 年後挖出來——<b>街道、店鋪、壁畫、麵包店的烤爐都還在<\/b>，像時間停住的城市。<\/p>\n<p><b>現場看哪裡<\/b>：① 廣場（Foro）：背後就是維蘇威火山，最經典的照片 ② 街上的大石塊：給行人過馬路的「斑馬線」，石頭中間的縫是讓馬車輪子過 ③ 外帶熟食店（thermopolium）：櫃台上挖的洞放食物，兩千年前的便當店 ④ 石膏人像：火山灰裡人的形狀留成空洞，考古學家灌石膏做出來的，看了會很震撼。<\/p>\n<p><b>小撇步<\/b>：遺跡很大、全是石板路，<b>穿好走的鞋<\/b>；選 2–3 小時的路線就好，不用走完。<\/p>\n<\/div><\/details>\n\n<details><summary>🎄 拿波里：聖誕馬槽街＋蒙紗基督（D4）<\/summary><div class=\"gbody\">\n<p><b>聖誕馬槽街（Via San Gregorio Armeno）<\/b>：整條街都在做「presepe（耶穌誕生的馬槽場景）」小人偶的工作室。拿波里的馬槽不只有耶穌、聖母，還有披薩師傅、賣魚的、甚至足球員和政治人物的公仔。聖誕到 1 月 6 日是一年最熱鬧的時候。<\/p>\n<p><b>蒙紗基督（Cristo Velato）<\/b>：在 Sansevero 禮拜堂裡，1753 年用<b>一整塊大理石<\/b>雕出一層透明薄紗蓋在耶穌身上，看起來真的像布。以前大家以為是用化學方法把紗變成石頭。裡面禁止拍照。<\/p>\n<p><b>拿坡里披薩<\/b>：披薩的發源地。瑪格麗特披薩（番茄紅、莫札瑞拉白、羅勒綠＝義大利國旗）傳說是 1889 年做給瑪格麗特王后的。正宗的餅皮邊緣鼓鼓的、中間軟，<b>用刀叉吃或對折著吃<\/b>都可以。<\/p>\n<\/div><\/details>\n\n<details><summary>🌸 佛羅倫斯：大教堂、烏菲茲、大衛（D6–D8）<\/summary><div class=\"gbody\">\n<p><b>一句話<\/b>：文藝復興從這裡開始。有錢的梅迪奇家族花大錢養藝術家，米開朗基羅、達文西、波提切利都在這裡工作過。<\/p>\n<p><b>聖母百花大教堂的圓頂<\/b>：布魯內列斯基 1436 年蓋好，當時沒人知道這麼大的圓頂要怎麼蓋——他用兩層殼、魚骨紋磚，不用鷹架撐。爬上去 463 階，沒有電梯，很窄。<\/p>\n<p><b>烏菲茲美術館<\/b>：原本是梅迪奇家族的辦公室（uffizi＝offices）。一定要看：波提切利<b>《維納斯的誕生》<\/b>（站在貝殼上那位）和<b>《春》<\/b>，在同一間（10–14 號廳）。窗戶看出去是老橋。<\/p>\n<p><b>大衛像<\/b>：米開朗基羅 26 歲開始雕，<b>5.17 公尺<\/b>，比想像大很多。看他的右手特別大、眼睛看著遠方——是出手打巨人歌利亞之前那一刻。領主廣場上那尊是複製品，原作在學院美術館。<\/p>\n<p><b>老橋（Ponte Vecchio）<\/b>：1345 年的橋，上面原本是肉舖，16 世紀大公嫌臭把他們趕走，換成金飾店到今天。二戰時德軍炸掉佛羅倫斯所有的橋，只留下這一座。<\/p>\n<\/div><\/details>\n\n<details><summary>🗼 比薩斜塔（D7）<\/summary><div class=\"gbody\">\n<p><b>一句話<\/b>：1173 年開始蓋，蓋到第三層地基就下沉開始斜，花了快 200 年才蓋完。1990–2001 年整修把它扶正了一點，現在大約斜 4 度，專家說至少再撐 200 年。<\/p>\n<p><b>拍照<\/b>：最經典是「手推斜塔」——站在草地邊的矮牆上，相機放低一點拍。斜塔旁邊白色的是大教堂和洗禮堂，同一個廣場（奇蹟廣場）。<\/p>\n<\/div><\/details>\n\n<details open><summary>⛪ 聖家堂（D9）<\/summary><div class=\"gbody\">\n<p><b>一句話<\/b>：高第 1883 年接手設計，蓋到他 1926 年過世還沒完成，靠門票和捐款一直蓋到今天——<b>蓋了 140 多年的教堂<\/b>。中間最高的耶穌基督塔在 2026 年加上十字架，成為世界最高的教堂。<\/p>\n<p><b>現場看哪裡<\/b>：① 外面：<b>誕生立面<\/b>（東邊，高第自己做的，像融化的蠟燭、滿滿的動植物）跟<b>受難立面<\/b>（西邊，線條很硬、很冷，故意的對比）② 裡面：柱子像樹一樣往上分岔，天花板是森林的樹葉；<b>彩繪玻璃東邊是藍綠（早晨）、西邊是橘紅（夕陽）<\/b>，下午 3–5 點西邊的光照進來最美。<\/p>\n<p><b>小撇步<\/b>：入口有機場那種安檢，大行李不能帶；肩膀膝蓋要遮。語音導覽在官方 App，帶耳機。<\/p>\n<\/div><\/details>\n\n<details><summary>🦎 高第的房子：巴特婁之家・米拉之家・奎爾公園（D9–D10）<\/summary><div class=\"gbody\">\n<p><b>巴特婁之家（Casa Batlló）<\/b>：外牆像海浪、陽台像面具、屋頂像一條龍的背——傳說是聖喬治屠龍（加泰隆尼亞的守護聖人），屋頂那根十字架就是刺進龍背的劍。<\/p>\n<p><b>米拉之家（Casa Milà）<\/b>：外號「採石場（La Pedrera）」，整棟外牆是波浪狀的石頭，沒有一面直牆。屋頂的煙囪像戴頭盔的士兵。<\/p>\n<p><b>奎爾公園（Park Güell）<\/b>：原本要蓋成高級住宅區，結果只賣出 2 間，後來變成公園。入口兩棟像糖果屋，階梯上有馬賽克蜥蜴（大家排隊合照那隻），上面的<b>彎彎曲曲長椅<\/b>可以看到整個巴塞隆納和海。<\/p>\n<\/div><\/details>\n\n<details><summary>🏰 哥德區＋三王節（D11）<\/summary><div class=\"gbody\">\n<p><b>哥德區（Barri Gòtic）<\/b>：巴塞隆納最老的區，羅馬時代的城牆還看得到。<b>主教橋（Pont del Bisbe）<\/b>是 1928 年才蓋的「假古董」，但現在是最多人拍的橋。傳說：橋下石雕的骷髏頭如果被拔掉匕首，巴塞隆納就會毀滅。<\/p>\n<p><b>三王節（Reyes，1/6）<\/b>：西班牙小孩收禮物不是聖誕節，是 1 月 6 日——東方三王（Melchor、Gaspar、Baltasar）騎駱駝帶禮物來。1/5 晚上三王坐船到港口，接著整城遊行、從花車上丟糖果。<b>1/6 是國定假日，大部分店都關<\/b>。<\/p>\n<\/div><\/details>\n"}, {"id": "food", "title": "🍝 吃什麼・怎麼點", "html": "\n<div class=\"card\">\n<h3>🕗 吃飯時間（最容易踩的坑）<\/h3>\n<div class=\"kv\"><div class=\"k\">義大利<\/div><div class=\"v\">午餐 12:30–14:30、晚餐 <b>19:30 以後<\/b>。很多餐廳 15:00–19:00 中間關門，下午餓了吃披薩切片、三明治、冰淇淋。<\/div><\/div>\n<div class=\"kv\"><div class=\"k\">西班牙<\/div><div class=\"v\">午餐 <b>14:00–16:00<\/b>、晚餐 <b>21:00 以後<\/b>才是正常時間。19:00–20:00 進餐廳很空，但有些店還沒開。中間餓了吃 tapas。<\/div><\/div>\n<\/div>\n\n<details open><summary>🇮🇹 義大利菜單怎麼看<\/summary><div class=\"gbody\">\n<p>菜單分 <b>Antipasti（前菜）→ Primi（第一道：義大利麵、燉飯）→ Secondi（第二道：肉、魚）→ Contorni（配菜，要另外點）→ Dolci（甜點）<\/b>。不用每道都點，兩個人「一個前菜＋兩份麵＋一份甜點」很正常，也可以兩人分一份主菜。<\/p>\n<p>帳單上的 <b>coperto<\/b>＝餐桌費（每人 €2–4，含麵包），是固定收的不是小費。<b>水要點<\/b>：naturale（沒氣泡）、frizzante（氣泡）。<\/p>\n<p>羅馬必吃四大麵：<b>Carbonara<\/b>（培根蛋黃起司）、<b>Cacio e pepe<\/b>（起司黑胡椒）、<b>Amatriciana<\/b>（番茄豬頰肉）、<b>Gricia<\/b>（豬頰肉起司）。<\/p>\n<\/div><\/details>\n\n<details><summary>🍕 拿坡里披薩<\/summary><div class=\"gbody\">\n<p>一人一片完整的（不切塊），用刀叉或對折吃。必點：<b>Margherita<\/b>（番茄、莫札瑞拉、羅勒）、<b>Marinara<\/b>（只有番茄、大蒜、奧勒岡，沒有起司）。<b>Fritta<\/b> 是炸披薩，拿坡里街頭小吃。<\/p>\n<p>名店要排隊：先去門口<b>抽號碼牌<\/b>或報名字，叫到才進去。<\/p>\n<p>拿波里甜點：<b>Sfogliatella<\/b>（千層貝殼酥，外酥內是瑞可塔起司）、<b>Babà<\/b>（浸蘭姆酒的蛋糕）。<\/p>\n<\/div><\/details>\n\n<details><summary>🥩 佛羅倫斯<\/summary><div class=\"gbody\">\n<p><b>Bistecca alla fiorentina<\/b>（佛羅倫斯丁骨牛排）：按重量賣（每公斤 €45–65），一塊至少 1–1.2 公斤，<b>兩個人分一塊剛好<\/b>。只烤三分熟（al sangue），要更熟店家可能不肯——這是傳統。<\/p>\n<p><b>Schiacciata<\/b>（托斯卡尼扁麵包三明治）：All'Antico Vinaio 那種，一個很大，兩人分。<\/p>\n<p><b>Lampredotto<\/b>（牛肚包）是在地小吃，敢吃內臟再試。<\/p>\n<\/div><\/details>\n\n<details><summary>🍦 冰淇淋（gelato）怎麼挑<\/summary><div class=\"gbody\">\n<p>好店的冰淇淋放在<b>有蓋子的不鏽鋼桶<\/b>裡、顏色自然（開心果是灰綠色不是螢光綠）；堆得像小山、顏色很鮮豔的多半是觀光店。小杯（piccola）就能選兩種口味。<\/p>\n<\/div><\/details>\n\n<details open><summary>🇪🇸 Tapas 怎麼點<\/summary><div class=\"gbody\">\n<p>一盤小份，兩人點 4–6 樣分著吃，不夠再加。必點：<b>Pan con tomate<\/b>（番茄抹麵包）、<b>Jamón ibérico<\/b>（伊比利火腿）、<b>Patatas bravas<\/b>（辣醬炸薯塊）、<b>Croquetas<\/b>（炸可樂餅）、<b>Gambas al ajillo<\/b>（蒜味橄欖油蝦）、<b>Pimientos de padrón<\/b>（煎小青椒，偶爾一顆很辣）、<b>Calamares<\/b>（炸花枝圈）。<\/p>\n<p>吧台站著吃比坐桌便宜也比較快。結帳：跟服務生說「La cuenta, por favor」。<\/p>\n<\/div><\/details>\n\n<details><summary>🥘 海鮮燉飯（paella）<\/summary><div class=\"gbody\">\n<p>大多 <b>2 人份起點<\/b>、現做要等 20–30 分。種類：<b>Paella de marisco<\/b>（海鮮）、<b>Arròs negre<\/b>（墨魚汁黑飯，配蒜泥醬 allioli）、<b>Fideuà<\/b>（用細麵代替米）。鍋底焦脆的那層（socarrat）是精華。<\/p>\n<p>當地人<b>中午吃燉飯<\/b>，晚上吃比較少見；照片看板、門口拉客的店多半冷凍加熱，避開。<\/p>\n<\/div><\/details>\n\n<details><summary>🥤 喝的<\/summary><div class=\"gbody\">\n<p>義大利：餐前酒 <b>Aperol Spritz<\/b>（橘色氣泡調酒）、拿坡里餐後 <b>Limoncello<\/b>（檸檬酒）。西班牙：<b>Sangría<\/b>（水果紅酒）、<b>Cava<\/b>（加泰隆尼亞氣泡酒）、<b>Vermut<\/b>（中午喝的苦艾甜酒）。<b>熱巧克力配吉拿棒<\/b>是早餐或下午茶。<\/p>\n<\/div><\/details>\n"}, {"id": "shop", "title": "🛍️ 購物・退稅", "html": "\n<div class=\"card\">\n<h3>🧾 退稅（買精品、衣服前先看）<\/h3>\n<div class=\"kv\"><div class=\"k\">義大利<\/div><div class=\"v\">同一家店、同一天買滿 <b>€70.01<\/b>（含稅）就能辦。結帳說「Tax free, please」＋給<b>護照正本<\/b>，店員開退稅單（現在多半是電子的）。<\/div><\/div>\n<div class=\"kv\"><div class=\"k\">西班牙<\/div><div class=\"v\"><b>沒有最低金額<\/b>，一樣要護照。<\/div><\/div>\n<div class=\"kv\"><div class=\"k\">在哪裡蓋章<\/div><div class=\"v\">退稅單要在<b>最後離開歐盟的機場<\/b>蓋章＝<b>1/6 巴塞隆納機場<\/b>（杜拜不是歐盟）。義大利買的單子也是在巴塞隆納處理。<b>要辦退稅的話 1/6 提早到機場<\/b>（多抓 1 小時），東西不要先托運——海關可能要看。<\/div><\/div>\n<small class=\"muted\">退稅公司（Global Blue、Planet…）的規則會變，結帳時問店員「最後從巴塞隆納出境，要怎麼退」。<\/small>\n<\/div>\n<div class=\"card\">\n<h3>🛍️ 這趟會經過的購物街<\/h3>\n<div class=\"kv\"><div class=\"k\">羅馬<\/div><div class=\"v\"><b>Via Condotti<\/b>（西班牙階梯前，精品一條街）、Via del Corso（平價品牌）<\/div><\/div>\n<div class=\"kv\"><div class=\"k\">拿波里<\/div><div class=\"v\"><b>Via Toledo<\/b>（飯店那條大街，Zara、H&amp;M、藥妝都有）<\/div><\/div>\n<div class=\"kv\"><div class=\"k\">佛羅倫斯<\/div><div class=\"v\"><b>皮件<\/b>：San Lorenzo 中央市場旁的皮件攤（要殺價、看清楚是不是真皮）；精品在 Via de' Tornabuoni<\/div><\/div>\n<div class=\"kv\"><div class=\"k\">巴塞隆納<\/div><div class=\"v\"><b>感恩大道 Passeig de Gràcia<\/b>（精品＋Zara 旗艦）、加泰隆尼亞廣場的 El Corte Inglés 百貨（退稅櫃台在裡面）<\/div><\/div>\n<div class=\"kv\"><div class=\"k\">伴手禮<\/div><div class=\"v\">義大利：巧克力（Baci）、松露醬、檸檬酒 limoncello（托運）、Mulino Bianco 餅乾；西班牙：橄欖油、Turrón（杏仁牛軋糖）、Cola Cao 可可粉<\/div><\/div>\n<small class=\"muted\">⚠️ 1/1 義大利、1/6 西班牙幾乎全部店都關；週日很多店也關或晚開。<\/small>\n<\/div>\n"}, {"id": "tips", "title": "💡 實用資訊（扒手、交通、錢、常用句）", "html": "\n<details open><summary>👜 扒手（這趟最重要的一條）<\/summary><div class=\"gbody\">\n<p>羅馬、巴塞隆納是歐洲扒手最多的城市，<b>聖誕假期人最多<\/b>。被偷的多半是手機和錢包，不是搶。<\/p>\n<p><b>最常見的手法<\/b>：① 地鐵門口擠上來，車門關前一秒衝下去 ② 餐廳、咖啡廳手機放桌上，有人拿一張紙／地圖蓋上去聊天，紙拿走手機就不見 ③ 有人主動幫你買票、拍照、問路、送手環 ④ 「你衣服髒了」幫你擦。<\/p>\n<p><b>怎麼防<\/b>：包包斜背在<b>前面<\/b>、有拉鍊；手機不放後口袋、不放桌上；手機掛繩很有用；地鐵上背包背前面。護照、主要信用卡、大部分現金放飯店保險箱或衣服內袋，出門只帶當天要用的。<\/p>\n<\/div><\/details>\n<details open><summary>🚇 交通怎麼搭<\/summary><div class=\"gbody\">\n<p><b>感應信用卡<\/b>：羅馬地鐵、公車可以直接用 Visa／Mastercard 感應進站（同一張卡一人一張，<b>兩個人不能刷同一張<\/b>）；巴塞隆納地鐵要買票卡（T-casual 10 次）。<\/p>\n<p><b>計程車<\/b>：叫車用 <b>FreeNow<\/b> 或 <b>itTaxi<\/b>（義大利）、<b>FreeNow／Cabify<\/b>（巴塞隆納），App 先綁卡。路邊只坐白色（羅馬）、黑黃色（巴塞隆納）有執照的車；機場有人拉客說「taxi?」不要跟。<\/p>\n<p><b>高鐵<\/b>：Trenitalia（紅色 Frecciarossa）、Italo（酒紅色）都是對號座，票在 App 裡，<b>不用打票<\/b>。區域火車（去比薩那種）紙本票上車前要在月台機器打票，用 App 買的要先在 App 按「check-in」。<\/p>\n<p><b>大行李<\/b>：高鐵行李放車廂兩頭的架子，看得到的位置。<\/p>\n<\/div><\/details>\n<details><summary>💶 錢<\/summary><div class=\"gbody\">\n<p>幾乎到處都能刷卡（感應最快）。小咖啡館、市場攤位、教堂捐獻、廁所（€0.5–1）要零錢 → 身上帶 €50–100 現金就夠。<\/p>\n<p>領錢用銀行的 ATM（Intesa、UniCredit、BBVA、CaixaBank），<b>不要用 Euronet<\/b>（藍黃色那種，手續費很高）。刷卡時機器問「用歐元還是台幣付」→ <b>選歐元（EUR）<\/b>，選台幣匯率很差。<\/p>\n<p><b>小費<\/b>：不用另外給。義大利帳單上的 coperto（餐桌費，每人 €2–4）是固定收的，不是小費；吃得很開心可以零頭不找。<\/p>\n<p><b>住宿稅<\/b>：每晚每人另外付給飯店（羅馬最貴），check-in 或 check-out 時收，多半能刷卡。<\/p>\n<\/div><\/details>\n<details><summary>☕ 在義大利點咖啡<\/summary><div class=\"gbody\">\n<p><b>caffè<\/b>＝濃縮（一小杯）；<b>cappuccino<\/b> 是早上喝的；<b>caffè latte<\/b> 要講全名，只說 latte 會拿到一杯牛奶。站在吧台喝比坐著便宜一半以上，先到收銀台付錢再拿收據去吧台點。<\/p>\n<\/div><\/details>\n<details><summary>📱 手機要有的 App<\/summary><div class=\"gbody\">\n<p><b>Google Maps<\/b>（書裡每個 📍 都直接開到那個地方）／<b>Trenitalia、Italo<\/b>（高鐵票）／<b>FreeNow<\/b>（叫車，義大利、西班牙都能用）／<b>Google 翻譯<\/b>（相機對著菜單）／<b>航空公司 App<\/b>（阿聯酋、1/2 那班）。上網：出發前買歐洲 eSIM（要含義大利＋西班牙）。<\/p>\n<\/div><\/details>\n<details><summary>🗣️ 救命義大利文・西班牙文<\/summary><div class=\"gbody\">\n<div class=\"phrase\"><span class=\"it\">Buongiorno / Buonasera<\/span><span class=\"pn\">崩久諾／崩娜塞拉<\/span>　早安／晚安（進店先講，店員會親切很多）<\/div>\n<div class=\"phrase\"><span class=\"it\">Grazie / Prego<\/span><span class=\"pn\">格拉齊耶／普雷果<\/span>　謝謝／不客氣<\/div>\n<div class=\"phrase\"><span class=\"it\">Il conto, per favore<\/span><span class=\"pn\">伊爾 孔托 佩爾 法沃雷<\/span>　買單（服務生不會主動拿帳單）<\/div>\n<div class=\"phrase\"><span class=\"it\">Hola / Gracias<\/span><span class=\"pn\">歐拉／格拉西亞斯<\/span>　（西班牙）你好／謝謝<\/div>\n<div class=\"phrase\"><span class=\"it\">La cuenta, por favor<\/span><span class=\"pn\">拉 寬塔 波爾 法沃爾<\/span>　（西班牙）買單<\/div>\n<div class=\"phrase\"><span class=\"it\">¿Dónde está el baño?<\/span><span class=\"pn\">東德 埃斯塔 埃爾 巴紐<\/span>　（西班牙）廁所在哪<\/div>\n<\/div><\/details>\n<details><summary>🙏 會被唸、會被罰的事<\/summary><div class=\"gbody\">\n<p>羅馬：<b>坐在西班牙階梯上會被罰款<\/b>（最高 €400），不能在噴泉裡泡腳、不能在古蹟邊吃東西。教堂、梵蒂岡<b>肩膀膝蓋要遮<\/b>，西斯汀禮拜堂裡不能拍照。<\/p>\n<p>巴塞隆納：街上不能穿泳衣（只有海灘可以）。晚上 10 點後在住宅區講話小聲一點。<\/p>\n<\/div><\/details>\n"}, {"id": "emerg", "title": "🆘 緊急聯絡", "html": "<div class=\"card\">\n  <h3 style=\"color:var(--rose)\">🚨 當地緊急電話（義大利、西班牙都一樣）<\/h3>\n  <div class=\"kv\"><div class=\"k\">全部<\/div><div class=\"v\"><a href=\"tel:112\">📞 112<\/a>（歐盟共用：警察、救護車、消防，有英文）<\/div><\/div>\n  <div class=\"kv\"><div class=\"k\">義大利<\/div><div class=\"v\">救護車 <a href=\"tel:118\">118<\/a>／憲兵 <a href=\"tel:112\">112<\/a>／警察 <a href=\"tel:113\">113<\/a><\/div><\/div>\n  <div class=\"kv\"><div class=\"k\">西班牙<\/div><div class=\"v\">觀光客報案：Mossos d'Esquadra（加泰隆尼亞警察）<a href=\"tel:112\">112<\/a>；扒竊要報案拿證明才能跟保險申請<\/div><\/div>\n<\/div>\n<div class=\"card\">\n  <h3>🇹🇼 駐義大利台北代表處（羅馬、拿波里、佛羅倫斯）<\/h3>\n  <div class=\"kv\"><div class=\"k\">地址<\/div><div class=\"v\">Viale Liegi 17, 00198 Roma<\/div><\/div>\n  <div class=\"kv\"><div class=\"k\">一般<\/div><div class=\"v\"><a href=\"tel:+390698262800\">📞 +39-06-9826-2800<\/a>（週一–五 9:00–17:00，護照遺失這種一般領務打這支，要預約）<\/div><\/div>\n  <div class=\"kv\"><div class=\"k\">急難<\/div><div class=\"v\"><a href=\"tel:+393668066434\">📞 +39-366-806-6434<\/a><br><small>只限人身安全、重大事故；護照掉了不算急難<\/small><\/div><\/div>\n<\/div>\n<div class=\"card\">\n  <h3>🇹🇼 駐西班牙台北經濟文化辦事處（巴塞隆納也歸它管，在馬德里）<\/h3>\n  <div class=\"kv\"><div class=\"k\">地址<\/div><div class=\"v\">C/ Rosario Pino 14-16, Piso 18, 28020 Madrid<\/div><\/div>\n  <div class=\"kv\"><div class=\"k\">一般<\/div><div class=\"v\"><a href=\"tel:+34915718426\">📞 +34-91-571-8426<\/a>（護照遺失打這支，週一–五 9:30–17:00）<\/div><\/div>\n  <div class=\"kv\"><div class=\"k\">急難<\/div><div class=\"v\"><a href=\"tel:+34639384883\">📞 +34-639-384-883<\/a><br><small>只限人身安全、重大事故<\/small><\/div><\/div>\n<\/div>\n<div class=\"card\">\n  <h3>☎️ 外交部（台灣）<\/h3>\n  <div class=\"kv\"><div class=\"k\">免付費<\/div><div class=\"v\"><a href=\"tel:+80008850885\">📞 00-800-0885-0885<\/a>（旅外國人急難救助全球免付費專線）<\/div><\/div>\n  <div class=\"kv\"><div class=\"k\">付費<\/div><div class=\"v\"><a href=\"tel:+886800085095\">📞 +886-800-085-095<\/a><\/div><\/div>\n  <small class=\"muted\">電話是 2026/11 從外交部領事事務局網頁抄的；出發前再看一次（號碼會換）。<\/small>\n<\/div>\n<div class=\"card\">\n  <h3>💳 東西被偷、護照掉了<\/h3>\n  <small class=\"muted\">\n  <b>出發前<\/b>：護照、信用卡正反面拍照存雲端；把發卡銀行的海外掛失電話存手機。兩人的護照影本各帶一份放不同包包。<br>\n  <b>卡被偷<\/b>：先打銀行掛失，再去警察局報案拿證明（Denuncia／Denuncia di furto）給保險。<br>\n  <b>護照掉了<\/b>：① 警察局報案拿遺失證明 ② 帶證明＋兩張大頭照＋身分證影本，打上面「一般」電話預約辦「入國證明書」（回台灣用）。代表處在羅馬、辦事處在馬德里，<b>在巴塞隆納掉了要跑一趟馬德里<\/b>（高鐵 2.5 小時）。護照放有拉鍊的內袋貼身帶，不要放後背包外層。<br>\n  <b>手機掉了<\/b>：先用另一個人的手機登入「尋找」把手機鎖起來，再改 Google、LINE 密碼。\n  <\/small>\n<\/div>"}], "wx": [{"n": "羅馬", "lat": 41.9, "lng": 12.5, "tz": "Europe/Rome", "ts": "2026-12-26", "te": "2026-12-28", "alt": "https://www.ilmeteo.it/meteo/Roma"}, {"n": "拿波里", "lat": 40.85, "lng": 14.27, "tz": "Europe/Rome", "ts": "2026-12-29", "te": "2026-12-30", "alt": "https://www.ilmeteo.it/meteo/Napoli"}, {"n": "佛羅倫斯", "lat": 43.77, "lng": 11.25, "tz": "Euro /* ── 這一天現在進行到哪 ── */
function status(day){
  if(!(NOW>=day.r0&&NOW<=day.r1))return null;
  var as=day.items.filter(function(x){return x.a!=null&&!x.sk}).sort(function(p,q){return p.a-q.a});
  var cur=null,nxt=null;
  for(var k=0;k<as.length;k++){if(as[k].a<=NOW)cur=as[k];else{nxt=as[k];break}}
  var tz=(nxt&&nxt.tz)||(cur&&cur.tz)||D.tz;
  return {cur:cur,nxt:nxt,tz:tz,label:'現在 '+hm(localOf(NOW,tz).min)+'・'+tzName(tz)};
}

/* ── 單日 ── */
var T0=0,T1=1;
function yOf(m){var f=(m-T0)/(T1-T0);f=Math.max(0,Math.min(1,f));return 'calc(16px + '+f.toFixed(4)+' * (100% - 32px))'}
function cardHTML(day,it,st){

  }

  else{

    time=(moved?'<span class="tn">'+hm(it.mm)+'</span>':hm(it.mm))+'–'+hm(it.e)+' · '+dur((it.ae-it.a)/60000)+(moved?'<s>原本 '+hm(it.m)+'</s>':'');
  }
  var xd=it.d?'<span class="xd">'+md(it.d)+'（'+wk(it.d)+'）'+esc(D.tzNames[it.tz]||'')+'</span>':(it.tz&&it.tz!==D.tz?'<span class="xd">'+esc(tzName(it.tz))+'</span>':'');
  var top='<div class="cc-top"><span class="pill">'+c.n+'</span>'+(it.star?'<span class="must">必去</span>':'')+
    (it.fixed?'<span class="lock">🔒 時間固定</span>':'')+xd+badge+'</div>';
  var body='<div class="cc-h">'+(it.hh||esc(it.h))+'</div><div class="cc-t">'+time+'</div>';

  else if(it.tx)body+='<div class="cc-x">'+it.tx+'</div>';
  if(it.warn)body+='<div class="cc-w">⚠️ '+it.warn+'</div>';
  if(it.tags&&it.tags.length)body+='<div class="tgs">'+it.tags.map(function(t){return '<span class="tg">'+esc(t)+'</span>'}).join('')+'</div>';

        return '<a class="pbtn" href="'+esc(gmap(p))+'" target="_blank" rel="noopener">📍 '+esc(p.name)+'</a>'}).join('')+'</div>':'')+'</div>'}).join('')+'</details>';
  if(it.more)full+='<details class="sub"><summary>'+esc(it.more.title)+'</summary>'+it.more.html+'</details>';
  if(it.links)full+='<div class="btns">'+it.links.map(function(l){return '<a class="pbtn" href="'+esc(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>'}).join('')+'</div>';
  if(it.extra)full+=it.extra.map(function(x){return '<details class="sub"><summary>'+esc(x.title)+'</summary>'+x.html+'</details>'}).join('');
  if(it.pins.length)full+='<div class="btns">'+it.pins.map(function(p){return '<a class="pbtn" href="'+esc(gmap(p))+'" target="_blank" rel="noopener">📍 '+esc(p.name)+'</a>'}).join('')+
    '<button class="pbtn alt" data-gomap="1">🗺️ 下面地圖</button></div>';

      (it.fixed?'':'<button data-a="up">⬆</button><button data-a="dn">⬇</button><button class="sk" data-a="sk">'+(it.sk?'不跳過':'跳過')+'</button>')+'</div>';

function renderDay(keep){
  var day=curDay(),st=status(day),list=$('#list'),ruler=$('#ruler'),keepTop=list.scrollTop;
  var main=day.main;
  T0=Infinity;T1=-Infinity;
  main.forEach(function(x){T0=Math.min(T0,x.rm);T1=Math.max(T1,x.re)});
  if(!isFinite(T0)){T0=0;T1=60}
  if(T1<=T0)T1=T0+60;
  var h='';
  day.list.forEach(function(it){
    if(st&&st.nxt===it){
      h+='<div class="nowbar">'+st.label+'</div>';
      if(!it.fixed&&!it.d&&it.m!=null)h+='<div class="nowq">還沒要去下一站？<button data-q="15">晚 15 分</button><button data-q="30">晚 30 分</button></div>';
    }
    h+=cardHTML(day,it,st);
  });
  list.innerHTML=h;
  var r='<div class="rax" style="top:'+yOf(T0)+';bottom:16px"></div>';
  var span=(T1-T0)/60,step=span>13?2:1;
  r+='<span class="rl end" style="top:'+yOf(T0)+'">'+hm(T0)+'</span><span class="rl end" style="top:'+yOf(T1)+'">'+hm(T1)+'</span>';
  for(var hh=Math.ceil(T0/60);hh*60<T1;hh+=1){
    var m=hh*60;if(hh%step)continue;if(m-T0<span*4.5||T1-m<span*4.5)continue;
    r+='<span class="rl" style="top:'+yOf(m)+'">'+hm(m)+'</span>';
  }
  main.forEach(function(x){
    var c=CAT[x.cat]||CAT.spot;
    r+='<i class="rt'+(x.sk?' sk':'')+'" style="background:'+c.c+';top:'+yOf(x.rm)+';height:calc('+((x.re-x.rm)/(T1-T0)).toFixed(4)+' * (100% - 32px) - 1px)"></i>';
  });
  r+='<div class="rind" id="rind" style="top:'+yOf(T0)+'"></div>';
  if(st){
    var yy=(NOW-day.base)/60000;
    if(yy>=T0-30&&yy<=T1+30)r+='<div class="rnow" style="top:'+yOf(yy)+'"><span>'+hm(localOf(NOW,D.tz).min)+'</span></div>';
  }
  ruler.innerHTML=r;
  if(keep){list.scrollTop=keepTop}
  else{
    var nb=list.querySelector('.nowbar'),cu=list.querySelector('.cc.cur');
    list.scrollTop=cu?Math.max(0,cu.offsetTop-10):nb?Math.max(0,nb.offsetTop-90):0;
    if(S.sel!=null){var el=list.querySelector('.cc[data-i="'+S.sel+'"]');if(el){el.classList.add('sel','open');list.scrollTop=Math.max(0,el.offsetTop-10)}}
  }
  if(keep&&S.sel!=null){var e2=list.querySelector('.cc[data-i="'+S.sel+'"]');if(e2)e2.classList.add('sel','open')}
  syncInd();
}
var indRaf=0;

  for(var k=0;k<cards.length;k++){var c=cards[k];if(c.offsetTop+c.offsetHeight>list.scrollTop+24){pick=day.items[+c.dataset.i];break}}

$('#list').addEventListener('click',function(e){

$('#ruler').addEventListener('click',function(e){

/* ── 調整時間的動作 ── */
function afterAdj(day,msg){
  saveAdj();compute(day);TODAY=findToday();
  renderChips();renderDay(true);markStrip();
  if(S.map==='day')mapDay();
  toast(msg);
}
function adjShift(day,i,dm){
  var a=aday(day),O=order(day),p=O.indexOf(i),n=0,stop=null;
  if(p<0)return;
  for(var q=p;q<O.length;q++){var x=day.items[O[q]];if(q>p&&x.fixed){stop=x;break}a.tm[x.i]=m2(day,x)+dm;n++}
  a.ord=O;
  var it=day.items[i],msg='「'+it.h+'」'+(n>1?'和後面 '+(n-1)+' 站':'')+(dm>0?'往後 ':'提早 ')+dur(Math.abs(dm));
  if(stop)msg+='，到 🔒「'+stop.h+'」停住';
  saveAdj();compute(day);
  if(stop&&stop.late)msg+='　⚠️ 會趕不上「'+stop.h+'」';
  afterAdj(day,msg);
}
function adjMove(day,i,dir){
  var a=aday(day),O=order(day),p=O.indexOf(i),q=p+dir;
  if(q<0||q>=O.length){toast(dir<0?'已經是第一站':'已經是最後一站');return}
  var x=day.items[i],y=day.items[O[q]];
  if(x.fixed||y.fixed){toast('🔒 時間固定的站不能換順序');return}
  var tx=m2(day,x),ty=m2(day,y);a.tm[x.i]=ty;a.tm[y.i]=tx;O[p]=y.i;O[q]=x.i;a.ord=O;
  afterAdj(day,'「'+x.h+'」和「'+y.h+'」換順序（時間不動）');
}
function adjSkip(day,i){
  var a=aday(day),x=day.items[i];
  if(a.skip[i])delete a.skip[i];else a.skip[i]=1;
  afterAdj(day,a.skip[i]?'跳過「'+x.h+'」（後面的時間不變）':'「'+x.h+'」恢復');
}
function adjReset(day){delete ADJ[day.id];afterAdj(day,'已還原這天原本的時間')}

/* ── 週行事曆 ── */
var PX=0.9;
function renderWeek(){
  var h0=1440,h1=0;
  D.days.forEach(function(d){d.main.forEach(function(x){h0=Math.min(h0,x.rm);h1=Math.max(h1,x.re)})});
  h0=Math.floor(h0/60)*60;h1=Math.min(Math.ceil(h1/60)*60,1560);
  var H=(h1-h0)*PX,n=D.days.length;
  var g='<div class="wk-in" style="grid-template-columns:40px repeat('+n+',104px);grid-template-rows:auto '+H+'px"><div class="wk-corner"></div>';
  D.days.forEach(function(d){g+='<div class="wk-hd'+(d.n===S.day?' sel':'')+(TODAY&&TODAY.n===d.n?' today':'')+'" data-n="'+d.n+'">週'+wk(d.date)+'<br><b>'+md(d.date)+'</b><i>'+esc(d.city)+'</i></div>'});
  g+='<div class="wk-hours" style="grid-row:2;grid-column:1;position:sticky">';
  for(var m=h0+60;m<h1;m+=60)g+='<span style="top:'+((m-h0)*PX)+'px">'+hm(m)+'</span>';
  g+='</div>';
  var lines='background-image:repeating-linear-gradient(to bottom,#ece4d3 0 1px,transparent 1px '+(60*PX)+'px)';
  D.days.forEach(function(d,ci){
    g+='<div class="wk-col'+(d.n===S.day?' sel':'')+'" style="grid-row:2;grid-column:'+(ci+2)+';'+lines+'">';
    d.main.forEach(function(x){
      var c=CAT[x.cat]||CAT.spot,top=(x.rm-h0)*PX,ht=Math.max((x.re-x.rm)*PX-2,12),mv=x.cat==='move',sm=!mv&&ht<34;
      g+='<div class="wb'+(mv?' mv':'')+(sm?' sm':'')+(x.star?' star':'')+(x.sk?' sk':'')+'" data-n="'+d.n+'" data-i="'+x.i+'" style="--c:'+c.c+';--bgc:'+c.bg+';top:'+top+'px;height:'+ht+'px">'+
        (mv?esc(x.h):sm?'<b class="wl">'+hm(x.mm)+(x.fixed?'🔒':'')+' '+esc(x.h)+'</b>':'<small>'+hm(x.mm)+(x.fixed?' 🔒':'')+'</small><b>'+esc(x.h)+'</b>')+'</div>';
    });
    if(TODAY&&TODAY.n===d.n){var nm=localOf(NOW,D.tz).min;if(nm>=h0&&nm<=h1)g+='<div class="wnow" style="top:'+((nm-h0)*PX)+'px"></div>'}
    g+='</div>';

function tilesTo(map){

var KCOL={park:'#2f6db3',expo:'#c8553d',food:'#c8553d',sight:'#5b4b8a',shop:'#8a73a8',cafe:'#b8894f',drink:'#1f8a70',night:'#d0577f',alt:'#7a8190',stage:'#b8860b'};
function kColor(k){return KCOL[k]||'#7a8190'}
function pkey(p){return p.n?'n:'+p.n:p.label}   /* 有編號用編號去重複（兩個編號同一個座標也都要畫） */
$$('.mseg button').forEach(function(b){b.onclick=function(){setMapMode(b.dataset.m)}});
function setMapMode(m){S.map=m;$$('.mseg button').forEach(function(b){b.classList.toggle('on',b.dataset.m===m)});if(m==='all')mapAll();else{mapDay();if(S.sel!=null)mapSel(curDay().items[S.sel])}}
function mkIcon(n,c,on,fg){return L.divIcon({className:'',html:'<div class="mk'+(on?' on':'')+'" style="--c:'+c+(fg?';color:'+fg:'')+'">'+esc(n)+'</div>',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-12]})}
function inPart(day,it,k){
  var mp=(day.maps||[])[k];if(!mp)return true;
  if(mp.labels&&!it.pins.some(function(p){return mp.labels.indexOf(p.label)>=0}))return false;
  if(mp.win&&it.mm!=null&&!it.d&&(it.mm<mp.win[0]||it.mm>mp.win[1]))return false;
  if(mp.win&&it.d)return false;
  return true;
}
function partOf(day,it){var n=(day.maps||[]).length;for(var k=0;k<n;k++)if(inPart(day,it,k))return k;return -1}
function mapDay(){
  var day=curDay(),parts=(day.maps||[]).length>1;
  if(parts&&(S.part==null||S.part>=day.maps.length)){
    var st=status(day),ref=(S.sel!=null&&day.items[S.sel])||(st&&(st.cur||st.nxt));var pk=ref?partOf(day,ref):-1;S.part=pk<0?0:pk;
  }
  var pp=$('#mcParts');pp.hidden=!parts;
  pp.innerHTML=parts?day.maps.map(function(m,k){return '<button data-part="'+k+'" class="'+(k===S.part?'on':'')+'">'+esc(m.t)+'</button>'}).join(''):'';
  $('#mcT').textContent=(ONE?'':day.tab?day.tab+' 版・':'Day '+day.n+'・')+md(day.date)+'（'+wk(day.date)+'）地圖';
  $('#mcNote').textContent='數字＝這天去的順序，虛線連起來是走的方向（跳過的站不畫）。左上角 📍 按了會顯示你在哪。';
  if(S.map!=='day')return;
  if(!MAP)return;
  LAYER.clearLayers();MK={};SELMK=null;
  var order=[],seq=[];
  day.list.forEach(function(it){
    if(parts&&!inPart(day,it,S.part))return;
    it.pins.forEach(function(p,k){
      if(!MK[pkey(p)]){
        /* 頁面自己有編號（P1、1…）就用它和它的顏色，跟文字裡的圓圈對得起來；沒有才用 1、2、3 */
        /* 這頁有自己的編號系統（D.pts）時，沒有編號的點只畫一個小圓點，不要用 1、2、3 跟文字裡的編號撞號 */
        var n=p.n||(D.pts?'·':String(order.length+1)),c=p.n?kColor(p.k):(CAT[it.cat]||CAT.spot).c,fg=p.n?'#fff':'';
        order.push({p:p,n:n,c:c,it:it,fg:fg});
        var m=L.marker([p.lat,p.lng],{icon:mkIcon(n,c,false,fg)}).addTo(LAYER);
        m.bindPopup('<b>'+esc(n)+'. '+esc(p.name)+'</b><br>'+(it.mm==null?'':hm(it.mm)+' ')+esc(it.h)+'<br><a href="'+esc(gmap(p))+'" target="_blank" rel="noopener">開 Google 地圖 ↗</a>');
        m.on('click',function(){selectItem(it.i,{open:true,scroll:true})});
        MK[pkey(p)]={m:m,n:n,c:c,fg:fg};
      }
      if(k===0&&!it.sk){var last=seq[seq.length-1];if(!last||last[0]!==p.lat||last[1]!==p.lng)seq.push([p.lat,p.lng])}
    });
  });
  if(seq.length>1)L.polyline(seq,{color:'#262421',weight:2.5,opacity:.55,dashArray:'6 7'}).addTo(LAYER);
  PTS=order.map(function(o){return [o.p.lat,o.p.lng]});
  /* 畫面只框「去玩、去吃」的點：交通站（車站、機場）照畫但不算進範圍，不然一頭一尾會把市區縮成一團；
     只有一張圖但有時間範圍（例：第一天不含機場）→ 範圍外的點也不算 */
  var w=(!parts&&day.maps&&day.maps[0]&&day.maps[0].win)?day.maps[0].win:null;
  var fit=order.filter(function(o){return o.it.cat!=='move'&&o.it.cat!=='flight'&&(!w||(o.it.mm!=null&&!o.it.d&&o.it.mm>=w[0]&&o.it.mm<=w[1]))});
  FITPTS=fit.length?fit.map(function(o){return [o.p.lat,o.p.lng]}):null;
  $('#mcList').innerHTML=order.map(function(o){return '<button data-i="'+o.it.i+'" style="--c:'+o.c+'"><i'+(o.fg?' style="color:#fff;width:auto;min-width:18px;padding:0 3px"':'')+'>'+esc(o.n)+'</i>'+esc(String(o.p.name).replace(/^\S{1,3} /,''))+'</button>'}).join('')||'<span class="mc-note" style="padding:0">這天沒有地圖上的點</span>';
  fitMap();
}
function mapAll(){
  $('#mcT').textContent='整趟路線';$('#mcParts').hidden=true;
  $('#mcSel').innerHTML=D.ovRoute.length?'實線＝搬城市（照順序），虛線＝當天來回。':'這趟去的地方（點圖示看是哪裡）。';

  });

    var a=byName[r[0]],b=byName[r[1]];if(!a||!b)return;
    var main=r[3]==='main';

    if(main)L.marker([(a.lat+b.lat)/2,(a.lng+b.lng)/2],{interactive:false,icon:L.divIcon({className:'',html:'<div class="ovm">'+(MODE_IC[r[2]]||'➜')+'</div>',iconSize:[24,22],iconAnchor:[12,11]})}).addTo(LAYER);
  });
  $('#mcList').innerHTML=D.ov.map(function(o){return '<button data-ov="'+esc(o.name)+'" style="--c:#fff"><i style="border:0;background:none">'+o.icon+'</i>'+esc(o.name)+'</button>'}).join('');
  PTS=D.ov.map(function(o){return [o.lat,o.lng]});
  MAP.fitBounds(PTS,{padding:[24,24]});

function fitMap(){
  if(!MAP||!PTS.length)return;
  if(S.map==='all'){MAP.fitBounds(PTS,{padding:[24,24]});return}
  var P=FITPTS||PTS;
  var num=function(a,b){return a-b},la=P.map(function(p){return p[0]}).sort(num),ln=P.map(function(p){return p[1]}).sort(num);
  var c=L.latLng(la[la.length>>1],ln[ln.length>>1]);
  var pts=P.filter(function(p){return c.distanceTo(p)<40000});if(!pts.length)pts=P;
  if(pts.length===1)MAP.setView(pts[0],15);else MAP.fitBounds(pts,{padding:[26,26],maxZoom:16});
}

var WXC={};
function wmo(c){
  if(c===0)return['☀️','晴'];if(c<=2)return['🌤️','晴時多雲'];if(c===3)return['☁️','陰天'];if(c===45||c===48)return['🌫️','霧'];
  if(c>=51&&c<=57)return['🌦️','毛毛雨'];if(c>=61&&c<=67)return['🌧️','雨'];if(c>=71&&c<=77)return['🌨️','雪'];
  if(c>=80&&c<=82)return['🌦️','陣雨'];if(c>=85&&c<=86)return['🌨️','陣雪'];if(c>=95)return['⛈️','雷雨'];return['🌡️',''];
}
function wxGet(k,cb){
  if(WXC[k]){cb(WXC[k]);return}
  var c=D.wx[k];WXC[k]={loading:1,time:[]};
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+c.lat+'&longitude='+c.lng+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone='+encodeURIComponent(c.tz)+'&forecast_days=16')
    .then(function(r){return r.json()}).then(function(j){WXC[k]=j.daily||{time:[]};cb(WXC[k])})
    .catch(function(){WXC[k]={time:[],err:1};cb(WXC[k])});
}
function wxDay(k,iso){
  var w=WXC[k];if(!w||!w.time)return null;var i=w.time.indexOf(iso);if(i<0)return null;
  var x=wmo(w.weather_code[i]);
  return {ic:x[0],tx:x[1],hi:Math.round(w.temperature_2m_max[i]),lo:Math.round(w.temperature_2m_min[i]),rain:w.precipitation_probability_max[i]==null?0:w.precipitation_probability_max[i]};
}
var wxSel=-1;
function wxInit(){
  if(wxSel>=0)return;
  if(!D.wx.length){$('#wxList').textContent='這本沒有設定天氣城市。';wxSel=0;return}
  var t=$('#wxTabs');
  t.innerHTML=D.wx.map(function(c,i){return '<button data-w="'+i+'">'+esc(c.n)+'</button>'}).join('');
  t.onclick=function(e){var b=e.target.closest('[data-w]');if(b)wxShow(+b.dataset.w)};
  var k=wxIdx(TODAY||curDay());wxShow(k<0?0:k);
}
function wxShow(k){
  wxSel=k;$$('#wxTabs button').forEach(function(b){b.classList.toggle('on',+b.dataset.w===k)});
  var c=D.wx[k],box=$('#wxList');box.innerHTML='載入中…（要連網）';
  wxGet(k,function(w){
    if(wxSel!==k)return;
    if(w.err||!w.time.length){box.innerHTML='天氣載入失敗（要連網）。<a href="'+esc(c.alt)+'" target="_blank" rel="noopener">當地氣象網站 ↗</a>';return}
    var h='';
    w.time.forEach(function(iso){
      var d=wxDay(k,iso),stay=iso>=c.ts&&iso<=c.te;
      h+='<div class="wxd'+(stay?' stay':'')+'"><span class="dd">'+md(iso)+'（'+wk(iso)+'）'+(stay?'★':'')+'</span><span class="ic">'+d.ic+'</span><span class="tp">'+d.hi+'° / '+d.lo+'°</span><span class="rn'+(d.rain>=50?' hi':'')+'">💧'+d.rain+'%</span></div>';
    });
    var inRange=w.time.indexOf(c.ts)>=0||w.time.indexOf(c.te)>=0;
    box.innerHTML=(inRange?'':'<div style="margin-bottom:6px">住在'+esc(c.n)+'的日子（'+md(c.ts)+'–'+md(c.te)+'）還不在預報範圍，下面是最近 16 天。</div>')+h+
      '<div style="margin-top:8px;color:var(--mut);font-size:12.5px">★＝住在這個城市的日子。'+D.wxNote+'</div>';
  });
}

var OPEN={};
function showSheet(id){OPEN[id]=1;$('#'+id).hidden=false;document.documentElement.style.overflow='hidden'}
function hideSheet(id){delete OPEN[id];$('#'+id).hidden=true;if(!Object.keys(OPEN).length)document.documentElement.style.overflow=''}
document.addEventListener('click',function(e){var c=e.target.closest('[data-close]');if(c)hideSheet(c.dataset.close)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(OPEN.peek)hideSheet('peek');else if(OPEN.sheet)hideSheet('sheet')}});
/* 把一章拆成小卡：.card、h3 段落、原本的 details 都變成收起來的小卡（只看標題） */
function chunkify(root){
  var kids=Array.prototype.slice.call(root.children),cur=null;
  kids.forEach(function(el){
    var tag=el.tagName;
    if(tag==='DETAILS'){el.removeAttribute('open');el.classList.add('blk');cur=null;return}
    if(el.classList.contains('card')){
      var t=el.querySelector('.tc-h')||el.querySelector('h3,h4');
      var d=document.createElement('details');d.className='blk';if(el.id){d.id=el.id;el.removeAttribute('id')}
      var sm=document.createElement('summary');
      if(t){sm.innerHTML=t.innerHTML;t.remove()}else sm.textContent=(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,24)+'…';
      root.insertBefore(d,el);d.appendChild(sm);var bd=document.createElement('div');bd.className='in';d.appendChild(bd);bd.appendChild(el);cur=null;return}
    if(/^H[23]$/.test(tag)){
      var d2=document.createElement('details');d2.className='blk';if(el.id)d2.id=el.id;
      var s2=document.createElement('summary');s2.innerHTML=el.innerHTML;
      root.insertBefore(d2,el);el.remove();d2.appendChild(s2);cur=document.createElement('div');cur.className='in';d2.appendChild(cur);return}
    if(cur)cur.appendChild(el);
  });
  var bl=root.querySelectorAll(':scope>details.blk');if(bl.length===1)bl[0].open=true;
}
function infoClick(e){
  var pn=e.target.closest&&e.target.closest('.pn');
  if(pn&&!pn.closest('.phrase')){e.preventDefault();e.stopPropagation();peek(pn.textContent.trim());return}
  anchorClick(e);
}
function openInfo(sid,anchor){
  var s=D.info.filter(function(x){return x.id===sid})[0];if(!s)return;
  var tt=splitTitle(s);$('#shT').textContent=tt[0]+' '+tt[1];
  var b=$('#shB');b.innerHTML='';var host=document.createElement('div');b.appendChild(host);
  var sr=host.attachShadow({mode:'open'});
  sr.innerHTML='<style>'+PROSE+'</style><div class="v1w">'+s.html+'</div>';
  /* A／B 兩版的頁：只留現在選的那一版的文字 */
  if(VER){var tab=curDay().tab;$$('[data-vv],[data-ver]',sr).forEach(function(el){var v=el.getAttribute('data-vv')||el.getAttribute('data-ver');if(v&&v!==tab)el.parentNode.removeChild(el)})}
  chunkify(sr.querySelector('.v1w'));
  /* 打勾清單：存在這支手機 */
  var ck=LS.get(NS+'ck-'+sid,{});
  $$('input[type=checkbox]',sr).forEach(function(c,k){c.checked=!!ck[k];c.dataset.k=k});
  sr.addEventListener('change',function(e){var c=e.target;if(c.dataset.k==null)return;var o=LS.get(NS+'ck-'+sid,{});o[c.dataset.k]=c.checked?1:0;LS.set(NS+'ck-'+sid,o)});
  sr.addEventListener('click',infoClick);
  showSheet('sheet');b.scrollTop=0;
  if(anchor){var el=sr.getElementById(anchor);if(el){var d=el.closest('details');if(d)d.open=true;if(el.tagName==='DETAILS')el.open=true;setTimeout(function(){el.scrollIntoView({block:'start'})},60)}}
}
function openWeather(){
  $('#shT').textContent='🌤️ 天氣';
  $('#shB').innerHTML='<div class="wxtabs" id="wxTabs" style="padding:0"></div><div class="wxl" id="wxList" style="padding:8px 0"></div>';
  wxSel=-1;showSheet('sheet');wxInit();
}
/* 編號圓圈 → 小地圖 */
var PKMAP=null,PKLAYER=null;
function peek(n){
  var p=D.pts&&D.pts[n];if(!p){toast('「'+n+'」沒有地圖位置');return}
  $('#pkT').innerHTML='<span class="pn" style="background:'+kColor(p.k)+'">'+esc(n)+'</span> '+esc(p.zh);
  var hits=[];D.days.forEach(function(d){d.items.forEach(function(it){if(it.pins.some(function(q){return q.n===n}))hits.push([d,it])})});
  var seen={};hits=hits.filter(function(x){var k=x[1].h;if(seen[k])return false;seen[k]=1;return true});
  $('#pkB').innerHTML='<div class="btns" style="margin-top:0"><a class="pbtn alt" href="https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng+'&travelmode=driving" target="_blank" rel="noopener">🧭 導航過去</a><a class="pbtn" href="'+esc(p.url||gmap(p))+'" target="_blank" rel="noopener">📍 Google 地圖</a></div>'+
    (hits.length?'<div style="margin-top:10px;color:var(--mut);font-size:12.5px">行程裡的這一站：</div><div class="btns" style="margin-top:4px">'+hits.slice(0,4).map(function(x){return '<button class="pbtn" data-goi="'+x[0].n+':'+x[1].i+'">'+(x[0].tab?x[0].tab+' 版 ':'')+(x[1].mm!=null?hm(x[1].mm)+' ':'')+esc(x[1].h)+'</button>'}).join('')+'</div>':'');
  showSheet('peek');
  setTimeout(function(){
    if(!window.L)return;
    if(!PKMAP){PKMAP=L.map('pkMap',{zoomSnap:0.25,scrollWheelZoom:false});tilesTo(PKMAP);PKLAYER=L.layerGroup().addTo(PKMAP)}
    PKMAP.invalidateSize();PKLAYER.clearLayers();
    Object.keys(D.pts).forEach(function(k){if(k===n)return;var q=D.pts[k];
      L.marker([q.lat,q.lng],{icon:mkIcon(k,kColor(q.k),false,'#fff'),opacity:.55}).addTo(PKLAYER)});
    L.marker([p.lat,p.lng],{zIndexOffset:1000,icon:L.divIcon({className:'',html:'<div class="mk mkbig" style="--c:'+kColor(p.k)+';color:#fff">'+esc(n)+'</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(PKLAYER);
    PKMAP.setView([p.lat,p.lng],16.5);
  },60);
}
$('#pkB').addEventListener('click',function(e){
  var b=e.target.closest('[data-goi]');if(!b)return;var a=b.dataset.goi.split(':');
  hideSheet('peek');hideSheet('sheet');showTab('plan');setDay(+a[0]);selectItem(+a[1],{open:true,scroll:true});$('#cal').scrollIntoView({behavior:'smooth'});
});
renderTiles();

/* ── 要先訂的 ── */
function renderRsv(){
  var done=LS.get(NS+'rsv',{}),h='',lastDay=0,ok=0;
  D.rsv.forEach(function(r){
    var k=r.day+'|'+r.h+'|'+r.tag;if(done[k]==null&&r.done)done[k]=1;if(done[k]===0)delete done[k];if(done[k])ok++;
    if(r.day!==lastDay){var d=D.days[r.day-1];h+='<div class="rv-h">'+dayTitle(d)+'　'+esc(d.city||'')+'</div>';lastDay=r.day}
    h+='<label class="rv'+(done[k]?' ok':'')+'"><input type="checkbox" data-k="'+esc(k)+'"'+(done[k]?' checked':'')+'><div><b>'+esc(r.h)+'</b><span>'+esc(r.t)+'・'+esc(r.tag)+'</span></div></label>';
  });
  $('#rvList').innerHTML=h;
  $('#rvSub').textContent='已處理 '+ok+' / '+D.rsv.length;
  $('#rvBar').style.width=(D.rsv.length?ok/D.rsv.length*100:0)+'%';
}
$('#rvList').addEventListener('change',function(e){
  var c=e.target;if(!c.dataset.k)return;var done=LS.get(NS+'rsv',{});
  done[c.dataset.k]=c.checked?1:0;LS.set(NS+'rsv',done);renderRsv();
});

/* ── 匯出到手機行事曆（用調整後的時間，跳過的不匯） ── */
function stripTags(h){var d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||'').trim()}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function utc(t){return new Date(t).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
function fold(line){var out=[];while(line.length>70){out.push(line.slice(0,70));line=' '+line.slice(70)}out.push(line);return out.join('\r\n')}
function nEvents(){var n=0;D.days.forEach(function(d){d.items.forEach(function(x){if(x.a!=null&&!x.sk)n++})});return n}
$('#ics').onclick=function(){
  var L2=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//travel-book//v2//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(D.title)],stamp=utc(Date.now());
  D.days.forEach(function(d){d.items.forEach(function(x){
    if(x.a==null||x.sk)return;
    var desc=[stripTags(x.chip),stripTags(x.tx),x.warn?'⚠️ '+stripTags(x.warn):''].filter(Boolean).join('\n'),p=x.pins[0];
    L2.push('BEGIN:VEVENT','UID:'+d.id+'-'+x.i+'@travel-book-v2','DTSTAMP:'+stamp,'DTSTART:'+utc(x.a),'DTEND:'+utc(x.ae),fold('SUMMARY:'+icsEsc((x.star?'⭐ ':'')+x.h)));
    if(desc)L2.push(fold('DESCRIPTION:'+icsEsc(desc)));
    if(p)L2.push(fold('LOCATION:'+icsEsc(p.name)),fold('URL:'+gmap(p)));
    L2.push('END:VEVENT');
  })});
  L2.push('END:VCALENDAR');
  var blob=new Blob([L2.join('\r\n')],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='trip.ics';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
};

/* ── 全部重畫 ── */
function markStrip(){
  $$('.sd').forEach(function(b){var d=D.days[+b.dataset.n-1];b.classList.toggle('sel',d.n===S.day);b.classList.toggle('today',!!TODAY&&TODAY.n===d.n);b.classList.toggle('adj',isAdj(d))});
}
function render(){
  var day=curDay();
  markStrip();centerStrip(true);
  $$('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===S.view)});
  $('#calSub').textContent=day.date.slice(0,4)+' 年 '+(+day.date.slice(5,7))+' 月';
  $('#dhN').innerHTML=dayTitle(day)+'<small>'+esc(day.tab?md(day.date)+'（'+wk(day.date)+'）':day.city)+'</small>'+
    (TODAY&&TODAY.n===day.n?'<span class="bdg">今天</span>':'')+(isAdj(day)?'<span class="bdg adj">調整過</span>':'');
  $('#dhR').textContent=day.route;
  $('#prev').disabled=S.day<=1;$('#next').disabled=S.day>=D.days.length;
  if(ONE)S.view='day';
  $('#strip').style.display=ONE?'none':'';$('.seg').style.display=(ONE||VER)?'none':'';$('.nav').style.display=ONE?'none':'';
  if(VER)S.view='day';
  var wv=S.view==='week';
  if(wv)S.adj=false;
  $('#dayView').style.display=wv?'none':'';$('#weekView').hidden=!wv;
  renderChips();
  if(wv)renderWeek();else renderDay();
  if(S.map==='day'){mapDay();if(!wv&&S.sel!=null)mapSel(day.items[S.sel]);else mapSel(null)}
  $('#ics').textContent='📅 加到 iPhone 行事曆（'+nEvents()+' 個行程）';
}
function tick(){
  if(PREVIEW)return;
  NOW=Date.now();renderClock();
  var was=TODAY&&TODAY.n;TODAY=findToday();
  if((TODAY&&TODAY.n)!==was){render();return}
  var d=curDay();
  if(S.view==='day'&&TODAY&&TODAY.n===d.n){var l=$('#list'),st=l.scrollTop;renderDay(true);l.scrollTop=st}
}

/* 網址版自動更新：deploy 寫 <meta name="v2-version" content="版本" data-file="xxx-version.txt"> */
function checkUpdate(){
  var m=document.querySelector('meta[name="v2-version"]');if(!m||!/^https?:/.test(location.protocol))return;
  fetch(m.getAttribute('data-file')+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(v){
    v=(v||'').trim();if(!v||v===m.content||QS.get('v')===v)return;
    QS.set('v',v);location.replace(location.pathname+'?'+QS.toString());
  }).catch(function(){});
}

window.__v2={D:D,S:S,ADJ:function(){return ADJ}};
renderStats();renderClock();initMap();renderRsv();render();
setTimeout(function(){centerStrip(false)},60);
setInterval(tick,30000);
checkUpdate();
document.addEventListener('visibilitychange',function(){if(!document.hidden){checkUpdate();tick()}});
})();
