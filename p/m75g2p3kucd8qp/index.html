<title>私人頁面</title>
<style>
/* 解鎖頁也用旅遊書的米白淺色底，手機深色模式也一樣（2026-10-25 Leo：「我不想要深色底」） */
:root{--bg:#f6f4ee;--card:#ffffff;--ink:#2b2a26;--muted:#6b675c;--acc:#3f5f45;--err:#b83a26;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
h1{margin:0;font-size:20px}
p{margin:0;color:var(--muted);font-size:14px}
input{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--muted);background:transparent;color:var(--ink);width:100%}
button{font:inherit;font-size:18px;font-weight:700;padding:12px;border-radius:12px;border:0;background:var(--acc);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--err);font-weight:700;min-height:1.2em}
</style>

</form>

  if(saved){
    decryptWith(b64(saved)).then(show).catch(function(){delStored();ask("");});
  }else ask("");
  form.addEventListener("submit",function(ev){
    ev.preventDefault();
    var p=pw.value; if(!p)return;
    go.disabled=true; go.textContent="解開中…"; err.textContent="";
    crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]).then(function(base){
      return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(S.salt),iterations:S.it},base,256);
    }).then(function(bits){
      return decryptWith(new Uint8Array(bits)).then(function(html){setStored(tob64(bits));show(html);});
    }).catch(function(){
      go.disabled=false; go.textContent="打開"; err.textContent="密碼不對，再試一次"; pw.select();
    });
  });
})();
</script>
<script>
(function(){
  function checkUpdate(){
    var m=document.querySelector('meta[name="book-version"]');
    if(!m||location.protocol==="file:")return;
    fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(v){
      v=(v||"").trim(); if(!v||v===m.content)return;
      var q=new URLSearchParams(location.search); if(q.get("v")===v)return;
      q.set("v",v); location.replace(location.pathname+"?"+q.toString()+location.hash);
    }).catch(function(){});
  }
  window.addEventListener("load",checkUpdate);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")checkUpdate();});
})();
</script>
